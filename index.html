let vyaparFilter = 'unlinked';
let vyaparSearch = '';
let pickerFor = null;      // kis product ka picker khula hai
let pickerTerm = '';
/* Product ke neeche ke Vyapar item (CEP ke 23) band rehte hain — naam par
   dabao tab khulte hain. Ek waqt me ek hi khula. */
let openVyaparRow = null;
function toggleVyaparRow(id){
  openVyaparRow = openVyaparRow === id ? null : id;
  paintVyaparList();
}

async function renderVyaparTab(box){
  const [{error: pErr}, {error: vErr}] = await Promise.all([loadProducts(), loadVyapar(true)]);
  const err = pErr || vErr;
  if(err){
    box.innerHTML = `<div class="msg error"><b>Vyapar data nahi khula:</b> ${esc(friendlyDbError(err))}</div>`;
    return;
  }
  const linked = productsCache.filter(p => linksFor(p.id).length).length;
  const synced = lastSyncedAt();
  box.innerHTML = `
    <div class="card">
      <h3>🔗 Vyapar Stock</h3>
      <p class="config-note" style="margin-top:-4px">
        અહીં એપની પ્રોડક્ટ અને Vyapar નું આઇટમ નામ જોડો. એક પ્રોડક્ટ સાથે ઘણા Vyapar આઇટમ
        જોડાઈ શકે — જેમ કે CDSA સાથે CDSA-HONDA, CDSA-TATA… — અને એ બધાનો સ્ટોક ભેગો થઈને
        એક જ આંકડો બને છે. Search માં આનાથી કંઈ બદલાતું નથી.
      </p>
      <div class="grid-stats grid-stats-2col" style="margin-top:12px">
        <div class="stat stat-good"><div class="num">${linked}</div><div class="lbl">જોડાઈ ગઈ</div></div>
        <div class="stat ${productsCache.length-linked ? 'stat-bad' : 'stat-neutral'}">
          <div class="num">${productsCache.length - linked}</div><div class="lbl">બાકી છે</div></div>
        <div class="stat stat-info"><div class="num">${vyaparLive.length}</div><div class="lbl">લાઇવ Vyapar item</div></div>
      </div>
      <p class="config-note" style="margin:12px 0 0">
        ${synced ? '📅 Vyapar માંથી છેલ્લે લીધેલું: <b>' + esc(synced.toLocaleString('en-IN')) + '</b>. આ હજી જાતે અપડેટ થતું નથી — AVEDIA PC થી sync જોડવાનું બાકી છે.'
                 : 'હજી સુધી Vyapar માંથી સ્ટોક આવ્યો નથી.'}
      </p>
    </div>
    <div class="card">
      <div class="segmented">
        <button class="${vyaparFilter==='unlinked'?'on':''}" onclick="setVyaparFilter('unlinked')">બાકી</button>
        <button class="${vyaparFilter==='linked'?'on':''}"   onclick="setVyaparFilter('linked')">જોડાયેલી</button>
        <button class="${vyaparFilter==='disc'?'on':''}"     onclick="setVyaparFilter('disc')">⛔ Discontinued</button>
        <button class="${vyaparFilter==='all'?'on':''}"      onclick="setVyaparFilter('all')">બધી</button>
      </div>
      <div class="big-search">
        <span class="mag">🔍</span>
        <input id="vq" class="search-safe" placeholder="પ્રોડક્ટ શોધો…" value="${esc(vyaparSearch)}" autocomplete="off">
      </div>
    </div>
    <div id="vyapar-hits"></div>
    <div id="vyapar-list"></div>`;
  const input = document.getElementById('vq');
  input.addEventListener('input', ()=>{ vyaparSearch = input.value; linkPickFor = null; paintVyaparHits(); paintVyaparList(); });
  paintVyaparHits();
  paintVyaparList();
}
/* Upar wale search me Vyapar ke item bhi — jaise "heat" likho to "9*9 Heat
   Press", "GYBOOM Heat Press", "Red Heat Press" apne stock ke saath, aur ye
   bhi ki kaunsi app product se jude hain. Jo juda nahi, use yahin se kisi
   product ke saath jod do. */
let linkPickFor = null;   // Vyapar item jise product se jodna hai
let linkPickTerm = '';
function productForItem(){
  const map = {};
  productsCache.forEach(p => vyaparRowsAll(p.id).forEach(v => { if(!map[v.item_name]) map[v.item_name] = p; }));
  return map;
}
function paintVyaparHits(){
  const wrap = document.getElementById('vyapar-hits');
  if(!wrap) return;
  const t = vyaparSearch.trim().toLowerCase();
  if(!t){ wrap.innerHTML = ''; return; }
  const hits = vyaparLive.filter(v => v.item_name.toLowerCase().includes(t)).slice(0, 20);
  if(!hits.length){ wrap.innerHTML = ''; return; }
  const owner = productForItem();
  wrap.innerHTML = `<div class="card">
    <h3 style="font-size:14px">🔗 Vyapar માં "${esc(vyaparSearch.trim())}" · ${hits.length} item</h3>
    ${hits.map(v=>{
      const p = owner[v.item_name];
      return `<div class="add-hit">
        <span class="ah-name">${markHit(v.item_name, vyaparSearch.trim())}
          <span class="mx-sub">${p ? '→ ' + esc(p.name) + (isDiscontinued(p.id) ? ' · ⛔' : '') : 'કોઈ પ્રોડક્ટ સાથે જોડાયેલું નથી'}</span></span>
        <span class="lh-qty">${fmtQty(v.current_stock)}</span>
        ${p ? '' : `<button class="primary" onclick="openLinkPick(${JSON.stringify(v.item_name).replace(/"/g,'&quot;')})">+ જોડો</button>`}
      </div>
      ${linkPickFor === v.item_name ? `<div class="link-pick">
        <div class="big-search"><span class="mag">🔍</span>
          <input id="lp-input" class="search-safe" placeholder="કઈ પ્રોડક્ટ સાથે? નામ લખો…" value="${esc(linkPickTerm)}" autocomplete="off"></div>
        <div id="lp-hits"></div>
      </div>` : ''}`;
    }).join('')}
  </div>`;
  const lp = document.getElementById('lp-input');
  if(lp){ lp.addEventListener('input', ()=>{ linkPickTerm = lp.value; paintLinkPickHits(); }); lp.focus(); paintLinkPickHits(); }
}
function openLinkPick(itemName){
  linkPickFor = linkPickFor === itemName ? null : itemName;
  linkPickTerm = '';
  paintVyaparHits();
}
function paintLinkPickHits(){
  const wrap = document.getElementById('lp-hits');
  if(!wrap || !linkPickFor) return;
  const t = linkPickTerm.trim().toLowerCase();
  const hits = (t ? productsCache.filter(p => p.name.toLowerCase().includes(t)) : []).slice(0, 15);
  wrap.innerHTML = t
    ? (hits.length ? hits.map(p=>`<div class="link-hit" onclick="linkItemToProduct(${p.id}, ${JSON.stringify(linkPickFor).replace(/"/g,'&quot;')})">
          <span>${markHit(p.name, linkPickTerm.trim())}</span>
          <span class="lh-qty">${linksFor(p.id).length ? 'જોડાયેલી' : 'બાકી'}</span>
        </div>`).join('')
       : `<p class="empty" style="text-align:center">"${esc(linkPickTerm)}" નામની પ્રોડક્ટ નથી.</p>`)
    : '<p class="config-note" style="margin:8px 0 0">પ્રોડક્ટનું નામ ટાઇપ કરો.</p>';
}
async function linkItemToProduct(productId, itemName){
  await addLink(productId, itemName);
  linkPickFor = null;
  paintVyaparHits();
}
function setVyaparFilter(f){ vyaparFilter = f; pickerFor = null; openVyaparRow = null; renderTabContent(); }
function paintVyaparList(){
  const wrap = document.getElementById('vyapar-list');
  if(!wrap) return;
  const t = vyaparSearch.trim().toLowerCase();
  let list = productsCache.filter(p=>{
    // Jis product ka picker khula hai wo list me bana rehta hai, warna pehla
    // naam jodte hi row "Baaki" filter se gayab ho jaati thi aur doosra naam
    // (CDSA jaison ke liye zaroori) jodne ka mauka hi nahi milta tha.
    if(p.id === pickerFor) return true;
    const has = linksFor(p.id).length > 0;
    if(vyaparFilter === 'linked'   && !has) return false;
    if(vyaparFilter === 'unlinked' &&  has) return false;
    // Discontinued filter: bina search ke sirf discontinued; search likhte hi
    // SAARE product naam se milte hain, har ek par ⛔ / ↩️ — yahin se add.
    if(vyaparFilter === 'disc' && !t && !isDiscontinued(p.id)) return false;
    return !t || p.name.toLowerCase().includes(t);
  });
  if(!list.length){
    wrap.innerHTML = `<div class="card"><p class="empty">${
      vyaparFilter==='unlinked' ? 'સરસ — કોઈ પ્રોડક્ટ બાકી નથી.' : 'અહીં કંઈ મળ્યું નથી.'}</p></div>`;
    return;
  }
  wrap.innerHTML = `<p class="result-count">${list.length} પ્રોડક્ટ</p>` + list.map(p=>{
    const rows = vyaparRowsFor(p.id);
    const total = stockFor(p.id);
    return `<div class="card">
      <div class="link-row" style="background:none; padding:0; margin:0">
        <span class="lr-name" style="cursor:pointer" onclick="toggleVyaparRow(${p.id})">${esc(p.name)}${
          linksFor(p.id).length ? ` <span class="bs-caret">${openVyaparRow === p.id ? '▴' : '▾'}</span>` : ''}</span>
        ${vyaparFilter === 'disc'
          ? (isDiscontinued(p.id)
              ? `<span class="pill unsold">⛔ Discontinued</span><button onclick="toggleProductDisc(${p.id}, false)">↩️ હટાવો</button>`
              : `<button class="danger" onclick="toggleProductDisc(${p.id}, true)">⛔ Discontinue</button>`)
          : linksFor(p.id).length
          ? `<span class="pill ${isDiscontinued(p.id) ? 'unsold' : 'sold'}">✓ જોડાયેલી${
                isDiscontinued(p.id)
                  ? ' · ⛔ Discontinued · ' + fmtQty(vyaparRowsFor(p.id, true).reduce((s,v)=>s+(num(v.current_stock)||0),0)) + ' સ્ટોક'
                  : (rows.length ? ' · ' + fmtQty(total) + ' સ્ટોક' : ' · Vyapar માં item બંધ · ' + fmtQty(vyaparRowsFor(p.id, true).reduce((s,v)=>s+(num(v.current_stock)||0),0)) + ' સ્ટોક')}</span>
             <button onclick="openPicker(${p.id})" title="બીજું Vyapar નામ ઉમેરો" style="min-height:32px; padding:4px 10px; font-size:12px">+ બીજું નામ</button>`
          : `<span class="pill unsold">જોડાયેલી નથી</span>
             <button class="primary" onclick="openPicker(${p.id})">+ Vyapar નામ જોડો</button>`}
      </div>
      ${linksFor(p.id).length ? `<div class="stock-parts" id="vlinks_${p.id}" style="display:${openVyaparRow === p.id ? '' : 'none'}">
        ${linksFor(p.id).map(l=>{
          const v = l.is_prefix ? null : vyaparIndex[String(l.pattern).toLowerCase()];
          // Prefix rule: "CDSA" se shuru hone waale saare live item apne aap —
          // naya variant Vyapar me bane to bhi jud jaata hai.
          if(l.is_prefix){
            const hit = vyaparLive.filter(x => x.item_name.toLowerCase().startsWith(String(l.pattern).toLowerCase()));
            // Rule ki ek line, phir uske andar ke har item par ⛔ / ↩️ —
            // taaki Beer Cover Mix jaisa ek variant haath se discontinue ho sake.
            return `<div class="stock-part">
              <span class="sp-name">${esc(l.pattern)}…<span class="sp-tag" style="color:var(--info)">prefix rule · ${hit.length} item આપોઆપ</span></span>
              <span class="sp-qty">${fmtQty(hit.filter(x=>!x.is_discontinued).reduce((s,x)=>s+(num(x.current_stock)||0),0))}</span>
              <button class="sp-x" onclick="removeLink(${l.id})">✕</button>
            </div>
            ${hit.map(x=>`<div class="stock-part${x.is_discontinued ? ' off' : ''}" style="padding-left:14px">
              <span class="sp-name">${esc(x.item_name)}${x.is_discontinued ? '<span class="sp-tag">Discontinued</span>' : ''}</span>
              <span class="sp-qty${(num(x.current_stock)||0) < 0 ? ' minus' : ''}">${fmtQty(x.current_stock)}</span>
              <button class="sp-x" title="${x.is_discontinued ? 'Discontinue હટાવો' : 'Discontinue લગાવો'}"
                onclick="toggleManualDisc(${JSON.stringify(x.item_name).replace(/"/g,'&quot;')}, ${x.is_discontinued ? 'false' : 'true'})">${x.is_discontinued ? '↩️' : '⛔'}</button>
            </div>`).join('')}`;
          }
          // v nahi mila = ya to Vyapar me band ho gaya, ya naam hi hata diya.
          // Dono me ye link ab kisi kaam ka nahi — dikhao taaki ✕ se hata sakein.
          const notLive = !v || v.is_active === false;
          const discTag = v && v.is_discontinued ? '<span class="sp-tag">Discontinued</span>' : '';
          return `<div class="stock-part${(notLive || (v && v.is_discontinued)) ? ' off' : ''}">
            <span class="sp-name">${esc(l.pattern)}${
              notLive ? '<span class="sp-tag">' + (v ? 'Vyapar માં બંધ (inactive)' : 'Vyapar માં આ નામ નથી') + ' · ગણતરીમાં નથી</span>' : discTag}</span>
            ${v ? `<button class="sp-x" title="${v.is_discontinued ? 'Discontinue હટાવો' : 'Discontinue લગાવો'}"
               onclick="toggleManualDisc(${JSON.stringify(v.item_name).replace(/"/g,'&quot;')}, ${v.is_discontinued ? 'false' : 'true'})">${v.is_discontinued ? '↩️' : '⛔'}</button>` : ''}
            <span class="sp-qty${v && (num(v.current_stock)||0) < 0 ? ' minus' : ''}">${v ? fmtQty(v.current_stock) : ''}</span>
            <button class="sp-x" onclick="removeLink(${l.id})">✕</button>
          </div>`;
        }).join('')}
      </div>` : ''}
      ${pickerFor === p.id ? pickerHtml(p) : ''}
    </div>`;
  }).join('');
  if(pickerFor){
    const pin = document.getElementById('pick-input');
    if(pin){
      pin.addEventListener('input', ()=>{ pickerTerm = pin.value; paintPickerHits(); });
      pin.focus();
    }
    paintPickerHits();
  }
}
function pickerHtml(p){
  return `<div class="link-pick">
    <div class="big-search">
      <span class="mag">🔍</span>
      <input id="pick-input" class="search-safe" placeholder="Vyapar નું નામ શોધો…" value="${esc(pickerTerm)}" autocomplete="off">
    </div>
    <div id="pick-hits"></div>
  </div>`;
}
function openPicker(id){
  pickerFor = pickerFor === id ? null : id;
  pickerTerm = '';
  paintVyaparList();
}
function paintPickerHits(){
  const wrap = document.getElementById('pick-hits');
  if(!wrap || !pickerFor) return;
  const t = pickerTerm.trim().toLowerCase();
  if(!t){ wrap.innerHTML = '<p class="config-note" style="margin:8px 0 0">Vyapar નું નામ ટાઇપ કરો.</p>'; return; }
  const taken = {};
  linksCache.forEach(l => { if(l.product_id === pickerFor) taken[String(l.pattern).toLowerCase()] = 1; });
  const hits = vyaparLive.filter(v => v.item_name.toLowerCase().includes(t) && !taken[v.item_name.toLowerCase()]).slice(0, 25);
  wrap.innerHTML = hits.length
    ? hits.map(v=>`<div class="link-hit" onclick="addLink(${pickerFor}, ${JSON.stringify(v.item_name).replace(/"/g,'&quot;')})">
        <span>${markHit(v.item_name, pickerTerm.trim())}</span>
        <span class="lh-qty">${fmtQty(v.current_stock)}</span>
      </div>`).join('')
    : `<p class="empty" style="text-align:center">"${esc(pickerTerm)}" Vyapar માં મળ્યું નથી.</p>`;
}
async function addLink(productId, pattern){
  const {data, error} = await sb.from('pbs_links')
    .insert({product_id: productId, pattern: pattern, is_prefix: false})
    .select('id, product_id, pattern, is_prefix').single();
  if(error){ toast(friendlyDbError(error), 'error'); return; }
  linksCache.push(data);
  pickerTerm = '';
  // Judte hi picker band — warna ye product "બાકી" list me tab tak dikhta
  // rehta tha jab tak picker khula rahe, aur lagta tha ki juda hi nahi.
  // Doosra naam jodna ho to "Jude hue" me jaake phir se + dabao.
  pickerFor = null;
  toast(pattern + ' જોડાઈ ગયું.');
  paintVyaparList();
}
/* Haath se discontinue: Vyapar ki list me nahi hai par aap jaante ho ki ye
   band ho gaya (Torch, Satellite Finder, CDSA STRIP…). Roz ka sync is flag
   ko nahi chhuta, isliye subah wapas nahi aata. */
async function toggleManualDisc(itemName, on){
  const {error} = await sb.from('pbs_vyapar_items').update({discontinued_manual: on}).eq('item_name', itemName);
  if(error){ toast(friendlyDbError(error), 'error'); return; }
  await loadVyapar(true);
  toast(on ? itemName + ' → discontinued' : itemName + ' → discontinue હટાવ્યું');
  paintVyaparList();
}
async function removeLink(linkId){
  const {error} = await sb.from('pbs_links').delete().eq('id', linkId);
  if(error){ toast(friendlyDbError(error), 'error'); return; }
  linksCache = linksCache.filter(l => l.id !== linkId);
  toast('કાઢી નાખ્યું.');
  paintVyaparList();
}

/* ---------------- BAGS tab (Flipkart QR + Barcode bag sizes) ---------------- */
async function renderBagsTab(box){
  const on = unlocked();
  const {data, error} = await sb.from('pbs_bags').select('*').order('sort_order');
  const bags = data || [];
  const editing = editingBagId ? bags.find(b=>b.id===editingBagId) : null;
  box.innerHTML = `
    ${!on ? '<p class="config-note">🔒 Add / Edit / Delete માટે ઉપર "Unlock" દબાવો.</p>' : `
    <div class="card">
      <div class="accordion-header" onclick="toggleAccordion('acc_bag')">
        <h3>${editing ? '✏️ Edit Bag' : '➕ Add Bag'}</h3>
        <span class="accordion-caret" id="acc_bag_caret">${editing?'▴':'▾'}</span>
      </div>
      <div class="accordion-body" id="acc_bag_body" style="display:${editing?'':'none'}; margin-top:12px;">
        <div class="form-row">
          <div class="field"><label>Bag Code</label>
            <input id="b_code" value="${esc(editing?editing.code:'')}" placeholder="SB2"></div>
          <div class="field" style="flex:2"><label>Product / Size</label>
            <input id="b_prod" value="${esc(editing?(editing.product||''):'')}" placeholder="Meter Tape"></div>
        </div>
        <div class="modal-actions">
          ${editing ? '<button onclick="editingBagId=null; render();">Cancel</button>' : ''}
          <button class="primary" onclick="saveBag()">${editing?'Save Changes':'Add Bag'}</button>
        </div>
      </div>
    </div>`}
    <div class="card">
      <h3>🛍️ Flipkart QR + Barcode Bag</h3>
      ${error?`<div class="msg error">${esc(friendlyDbError(error))}</div>`:''}
      ${bags.length ? `<table>
        <thead><tr><th>Bag</th><th>Product / Size</th>${on?'<th></th>':''}</tr></thead>
        <tbody>${bags.map(b=>`<tr>
          <td class="mono" style="font-weight:800; color:var(--maroon);">${esc(b.code)}</td>
          <td>${esc(b.product||'—')}</td>
          ${on?`<td style="white-space:nowrap; text-align:right;">
            <button onclick="editBag(${b.id})" style="padding:5px 9px; min-height:32px;">✏️</button>
            <button class="danger" onclick="deleteBag(${b.id})" style="padding:5px 9px; min-height:32px;">🗑️</button>
          </td>`:''}
        </tr>`).join('')}</tbody></table>` : '<p class="empty">કોઈ bag size ઉમેરાયું નથી.</p>'}
    </div>`;
  if(editing) openAccordion('acc_bag');
}
async function editBag(id){ await withPin(async ()=>{ editingBagId = id; await render(); window.scrollTo({top:0, behavior:'smooth'}); }); }
async function saveBag(){
  await withPin(async ()=>{
    const code = document.getElementById('b_code').value.trim();
    if(!code){ toast('Bag code લખવો જરૂરી છે.', 'error'); return; }
    const payload = { code, product: document.getElementById('b_prod').value.trim() || null };
    let error;
    if(editingBagId){
      ({error} = await sb.from('pbs_bags').update(payload).eq('id', editingBagId));
    } else {
      const {data} = await sb.from('pbs_bags').select('sort_order').order('sort_order',{ascending:false}).limit(1);
      payload.sort_order = data && data.length ? (data[0].sort_order||0)+1 : 0;
      ({error} = await sb.from('pbs_bags').insert(payload));
    }
    if(error){ toast(friendlyDbError(error), 'error'); return; }
    toast(editingBagId ? 'Bag અપડેટ થઈ ગયું.' : 'Bag ઉમેરાઈ ગયું.');
    editingBagId = null;
    await render();
  });
}
async function deleteBag(id){
  await withDeletePin(async ()=>{
    const {data} = await sb.from('pbs_bags').select('*').eq('id', id).single();
    if(!data) return;
    if(!confirm('Bag "' + data.code + '" ડિલીટ કરવું છે?')) return;
    const {error:snapErr} = await sb.from('pbs_deleted_items').insert({
      table_name:'pbs_bags',
      row_data:{code:data.code, product:data.product, sort_order:data.sort_order},
      summary:'Bag — ' + data.code + (data.product ? ' (' + data.product + ')' : ''),
    });
    if(snapErr){ toast(friendlyDbError(snapErr), 'error'); return; }
    const {error} = await sb.from('pbs_bags').delete().eq('id', id);
    if(error){ toast(friendlyDbError(error), 'error'); return; }
    toast('Bag ડિલીટ થઈ ગયું.');
    await render();
  });
}

/* ---------------- DELETED ITEMS tab (undo) ---------------- */
async function renderDeletedTab(box){
  const {data, error} = await sb.from('pbs_deleted_items').select('*').order('deleted_at', {ascending:false});
  const items = data || [];
  box.innerHTML = `<div class="card">
    <h3>♻️ Deleted Items</h3>
    <p class="config-note" style="margin-top:-4px">ભૂલથી ડિલીટ થયેલી પ્રોડક્ટ કે bag અહીંથી પાછું લાવી શકાય છે.</p>
    ${error?`<div class="msg error">${esc(friendlyDbError(error))}</div>`:''}
    ${items.length ? items.map(it=>`<div class="flat-entry">
        <span style="flex:1; min-width:0; font-weight:600;">${esc(it.summary||it.table_name)}</span>
        <span class="config-note" style="margin:0; font-size:11px;">${new Date(it.deleted_at).toLocaleDateString('en-IN')}</span>
        <span class="flat-actions">
          <button onclick="restoreDeleted(${it.id})">↩️ Restore</button>
          <button class="danger" onclick="forgetDeleted(${it.id})" title="હંમેશ માટે કાઢી નાખો">🗑️</button>
        </span>
      </div>`).join('') : '<p class="empty">કંઈ ડિલીટ થયું નથી.</p>'}
  </div>`;
}
async function restoreDeleted(id){
  await withPin(async ()=>{
    const {data:it, error:getErr} = await sb.from('pbs_deleted_items').select('*').eq('id', id).single();
    if(getErr || !it){ toast(friendlyDbError(getErr), 'error'); return; }
    const row = it.row_data || {};
    if(it.table_name === 'pbs_products'){
      const boxes = row.boxes || [];
      const prod = Object.assign({}, row);
      delete prod.boxes;
      const {data:ins, error} = await sb.from('pbs_products').insert(prod).select('id').single();
      if(error){ toast(friendlyDbError(error), 'error'); return; }
      if(boxes.length){
        const {error:bErr} = await sb.from('pbs_boxes').insert(boxes.map((b,i)=>({
          product_id: ins.id, box_dimension:b.box_dimension, unit_in_box:b.unit_in_box,
          sort_order: b.sort_order == null ? i : b.sort_order,
        })));
        if(bErr){ toast(friendlyDbError(bErr), 'error'); return; }
      }
    } else if(it.table_name === 'pbs_bags'){
      const {error} = await sb.from('pbs_bags').insert(row);
      if(error){ toast(friendlyDbError(error), 'error'); return; }
    }
    await sb.from('pbs_deleted_items').delete().eq('id', id);
    toast('પાછું આવી ગયું.');
    await render();
  });
}
async function forgetDeleted(id){
  // Ye asli mitana hai — restore ka rasta bhi band ho jata hai, isliye
  // yahan bhi wahi delete PIN.
  await withDeletePin(async ()=>{
    if(!confirm('આ history entry હંમેશ માટે કાઢી નાખવી છે? પછી પાછી નહીં આવે.')) return;
    const {error} = await sb.from('pbs_deleted_items').delete().eq('id', id);
    if(error){ toast(friendlyDbError(error), 'error'); return; }
    await render();
  });
}

function exportCSV(){
  const headers = ['Product Name','Box Weight','Box Dimension','Unit in Box','Unit Weight','FBA Unit','FBA Weight','Item Dimension','Item Box Dimension','Note','Image'];
  const rows = [];
  productsCache.forEach(p=>{
    const boxes = (p.pbs_boxes||[]).length ? p.pbs_boxes : [{box_dimension:null, unit_in_box:null}];
    boxes.forEach((b,i)=>{
      const bw = fmtWt(boxWeight(p,b));
      const fw = fmtWt(fbaWeight(p));
      rows.push([
        i===0 ? p.name : '',
        bw == null ? '' : bw,
        b.box_dimension == null ? '' : b.box_dimension,
        b.unit_in_box == null ? '' : b.unit_in_box,
        i===0 ? (p.unit_weight == null ? '' : p.unit_weight) : '',
        i===0 ? (p.fba_unit == null ? '' : p.fba_unit) : '',
        i===0 ? (fw == null ? '' : fw) : '',
        i===0 ? (p.item_dimension || '') : '',
        i===0 ? (p.item_box_dimension || '') : '',
        i===0 ? (p.notes || '') : '',
        i===0 ? (p.image_url || '') : '',
      ]);
    });
  });
  const csv = [headers].concat(rows)
    .map(r=>r.map(v=>'"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'product-box-size-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
const SETUP_SQL = [
"create table if not exists public.pbs_products (",
"  id bigint generated always as identity primary key,",
"  name text not null,",
"  unit_weight numeric,",
"  fba_unit integer,",
"  item_dimension text,",
"  item_box_dimension text,",
"  notes text,",
"  image_url text,",
"  created_at timestamptz not null default now()",
");",
"create unique index if not exists pbs_products_name_key on public.pbs_products (lower(name));",
"",
"create table if not exists public.pbs_boxes (",
"  id bigint generated always as identity primary key,",
"  product_id bigint not null references public.pbs_products(id) on delete cascade,",
"  box_dimension text,",
"  unit_in_box integer,",
"  sort_order integer not null default 0",
");",
"",
"create table if not exists public.pbs_bags (",
"  id bigint generated always as identity primary key,",
"  code text not null,",
"  product text,",
"  sort_order integer not null default 0",
");",
"",
"-- Vyapar ka stock (AVEDIA PC se sync hota hai) aur uska product se rishta",
"create table if not exists public.pbs_vyapar_items (",
"  item_name text primary key,",
"  current_stock integer,",
"  is_active boolean not null default true,",
"  synced_at timestamptz not null default now()",
");",
"",
"create table if not exists public.pbs_links (",
"  id bigint generated always as identity primary key,",
"  product_id bigint not null references public.pbs_products(id) on delete cascade,",
"  pattern text not null,",
"  is_prefix boolean not null default false,",
"  created_at timestamptz not null default now()",
");",
"create unique index if not exists pbs_links_uniq on public.pbs_links (product_id, lower(pattern), is_prefix);",
"create index if not exists pbs_links_product on public.pbs_links (product_id);",
"",
"create table if not exists public.pbs_deleted_items (",
"  id bigint generated always as identity primary key,",
"  table_name text not null,",
"  row_data jsonb not null,",
"  summary text,",
"  deleted_at timestamptz not null default now()",
");",
"",
"alter table public.pbs_products      enable row level security;",
"alter table public.pbs_boxes         enable row level security;",
"alter table public.pbs_bags          enable row level security;",
"alter table public.pbs_deleted_items enable row level security;",
"alter table public.pbs_vyapar_items  enable row level security;",
"alter table public.pbs_links         enable row level security;",
"",
"do $$",
"declare t text;",
"begin",
"  foreach t in array array['pbs_products','pbs_boxes','pbs_bags','pbs_deleted_items','pbs_vyapar_items','pbs_links'] loop",
"    execute format('drop policy if exists %I on public.%I', t||'_read', t);",
"    execute format('drop policy if exists %I on public.%I', t||'_write', t);",
"    execute format('create policy %I on public.%I for select to anon, authenticated using (true)', t||'_read', t);",
"    execute format('create policy %I on public.%I for all to anon, authenticated using (true) with check (true)', t||'_write', t);",
"  end loop;",
"end $$;",
"",
"insert into storage.buckets (id, name, public) values ('pbs-images','pbs-images', true)",
"on conflict (id) do update set public = true;",
"",
"drop policy if exists pbs_images_read  on storage.objects;",
"drop policy if exists pbs_images_write on storage.objects;",
"create policy pbs_images_read  on storage.objects for select to anon, authenticated using (bucket_id = 'pbs-images');",
"create policy pbs_images_write on storage.objects for all to anon, authenticated using (bucket_id = 'pbs-images') with check (bucket_id = 'pbs-images');",
].join('\n');
function copySetupSql(){
  navigator.clipboard.writeText(SETUP_SQL)
    .then(()=>toast('SQL કૉપી થઈ ગયું — Supabase SQL Editor માં પેસ્ટ કરો.'))
    .catch(()=>{ console.log(SETUP_SQL); toast('કૉપી ન થયું — console માં પ્રિન્ટ કરી દીધું.', 'error'); });
}

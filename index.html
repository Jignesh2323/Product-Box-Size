<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Box Size</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box Size">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   DESIGN SYSTEM — clean, flat, mobile-first. Same class names
   as before throughout the JS, only the visual language changed,
   so no markup/logic had to move.
   Palette: cool light surface, indigo primary, soft tinted
   status chips (green/red/amber/blue) instead of ledger colors.
   Type: Space Grotesk (headings) + Inter (UI/body) + IBM Plex
   Mono (money, vehicle numbers, dates — anything tabular).
   ============================================================ */
:root{
  --paper:#F3F4F8;
  --paper-dark:#E9EBF3;
  --ink:#14162B;
  --ink-soft:#6B7280;
  --maroon:#4F46E5;
  --maroon-dark:#3D34C9;
  --ledger-green:#16A34A;
  --rule:#E4E6EF;
  --white-card:#FFFFFF;
  --danger:#DC2626;
  --warning:#B45309;
  --info:#0369A1;
  --maroon-glow:rgba(79,70,229,.28);
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,22,43,.04), 0 8px 24px rgba(20,22,43,.07);
  --shadow-lg:0 4px 10px rgba(20,22,43,.08), 0 16px 40px rgba(20,22,43,.14);
  --nav-h:64px;
}
:root[data-theme="dark"]{
  --paper:#12131C;
  --paper-dark:#1E2030;
  --ink:#ECEDF7;
  --ink-soft:#9AA0B8;
  --maroon:#8B85FF;
  --maroon-dark:#A5A0FF;
  --ledger-green:#34D399;
  --rule:#2E3145;
  --white-card:#1A1C2A;
  --danger:#F87171;
  --warning:#FBBF24;
  --info:#38BDF8;
  --maroon-glow:rgba(139,133,255,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 10px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.5);
}
:root[data-theme="dark"] .stat-good{background:#0F2E22;}
:root[data-theme="dark"] .stat-good .num{color:#34D399;}
:root[data-theme="dark"] .stat-bad{background:#3A1414;}
:root[data-theme="dark"] .stat-bad .num{color:#F87171;}
:root[data-theme="dark"] .stat-neutral{background:#232349;}
:root[data-theme="dark"] .stat-neutral .num{color:#A5A0FF;}
:root[data-theme="dark"] .stat-info{background:#0E2A3A;}
:root[data-theme="dark"] .stat-info .num{color:#38BDF8;}
:root[data-theme="dark"] .stat-warning{background:#3A2A0E;}
:root[data-theme="dark"] .stat-warning .num{color:#FBBF24;}
:root[data-theme="dark"] .stat-two{background:#0E2E33;}
:root[data-theme="dark"] .stat-two .num{color:#22D3EE;}
:root[data-theme="dark"] .stat-four{background:#3A1414;}
:root[data-theme="dark"] .stat-four .num{color:#F87171;}
:root[data-theme="dark"] .stat-cash{background:#3A2A0E;}
:root[data-theme="dark"] .stat-cash .num{color:#FBBF24;}
:root[data-theme="dark"] .stat-bank{background:#0E2438;}
:root[data-theme="dark"] .stat-bank .num{color:#60A5FA;}
:root[data-theme="dark"] .pill.sold{background:#0F2E22; color:#34D399;}
:root[data-theme="dark"] .pill.unsold{background:var(--paper-dark);}
:root[data-theme="dark"] .msg.error{background:#3A1414; border-color:#7A3838;}
:root[data-theme="dark"] .msg.ok{background:#0F2E22; border-color:#2D6A4F;}
:root[data-theme="dark"] .search-safe{background:#0F2E22 !important; border-color:#34D399 !important;}
:root[data-theme="dark"] .search-safe::placeholder{color:#5FBE8A;}
:root[data-theme="dark"] button.danger{background:#3A1414; border-color:#7A3838;}
:root[data-theme="dark"] .hero-banner .who button.primary{background:var(--white-card); color:var(--maroon);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:700; margin:0 0 .3em; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
.app{max-width:920px; margin:0 auto; padding:16px; padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));}

.hero-banner{
  position:relative;
  margin:-16px -16px 24px;
  background:linear-gradient(135deg, #3730A3 0%, var(--maroon) 55%, #7C3AED 100%);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:22px 20px 26px;
  border-radius:0 0 26px 26px;
  box-shadow:0 14px 34px -10px rgba(55,48,163,.5);
  overflow:hidden;
}
.hero-banner::before{
  content:""; position:absolute; inset:0; z-index:0;
  background:radial-gradient(circle at 88% -15%, rgba(255,255,255,.28), transparent 55%);
}
.hero-banner .title-block{position:relative; z-index:1; display:flex; flex-direction:column; gap:3px; min-width:0;}
.hero-banner .eyebrow{
  color:rgba(255,255,255,.78); font-size:11px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase;
}
.hero-banner h1{
  color:#fff; font-size:22px; font-weight:800; margin:0; letter-spacing:-.01em; line-height:1.2;
  text-shadow:0 2px 12px rgba(0,0,0,.15);
}
.hero-banner .who{position:relative; z-index:1; display:flex; flex-direction:column-reverse; align-items:flex-end; gap:8px; font-size:13px; flex-shrink:0; margin-left:auto;}
.hero-banner .who button.primary{background:#fff; color:var(--maroon); border-color:#fff; box-shadow:0 2px 10px rgba(20,22,43,.2);}
.hero-banner .who button.primary:hover{background:#F3F4F8; border-color:#F3F4F8;}
.hero-banner .who button:not(.primary){background:rgba(255,255,255,.15); color:#fff; border-color:rgba(255,255,255,.4);}
.hero-banner .who button:not(.primary):hover{background:rgba(255,255,255,.25);}

button, .btn{
  font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
  border:1.5px solid var(--rule); background:var(--white-card); color:var(--ink);
  padding:11px 18px; min-height:44px; border-radius:var(--radius-sm); cursor:pointer;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
}
button:hover{border-color:#C7CAD9; background:var(--paper-dark);}
button:active{transform:scale(.97);}
button.primary{background:var(--maroon); color:#fff; border-color:var(--maroon); box-shadow:0 4px 14px var(--maroon-glow);}
button.primary:hover{background:var(--maroon-dark); border-color:var(--maroon-dark); box-shadow:0 6px 18px var(--maroon-glow);}
button.danger{border-color:#FCC; color:var(--danger); background:#FEF2F2;}
button.danger:hover{background:var(--danger); color:#fff; border-color:var(--danger);}

input, select, textarea{
  font-family:'Inter',sans-serif; font-size:15px; padding:11px 13px; min-height:44px;
  border:1.5px solid var(--rule); border-radius:var(--radius-sm); background:var(--white-card); color:var(--ink);
}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--maroon); box-shadow:0 0 0 3px rgba(79,70,229,.14);}
label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:6px; font-weight:600; letter-spacing:.01em;}
.field{margin-bottom:12px;}
.card{
  background:var(--white-card); border:1px solid var(--rule); border-radius:var(--radius);
  padding:20px; margin-bottom:18px; box-shadow:var(--shadow); overflow-x:auto;
}
.card h3{font-size:16.5px; margin-bottom:.5em;}
/* Search box list ke saath scroll hokar upar gayab ho jaata tha — 192 product
   me se kuch dhundte waqt baar baar upar lautna padta tha. Ab chipka rehta
   hai: mobile par screen ke sabse upar, PC par upar wali nav ke neeche
   (wo top PC waale media query me set hota hai). overflow-x hataya hai,
   warna sticky card apne hi scroll box me kaid ho jaata hai. */
.sticky-search{position:sticky; top:0; z-index:40; overflow-x:visible;}
.grid-stats{display:flex; flex-wrap:wrap; gap:10px;}
.stat{border-radius:var(--radius-sm); padding:13px 16px; background:var(--paper-dark); flex:0 0 auto; border:1px solid rgba(20,22,43,.03); transition:transform .15s ease;}
.stat .num{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:700; color:var(--ink);}
.stat .lbl{font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:3px; letter-spacing:.01em;}
.lbl-icon{font-size:17px; margin-right:5px; vertical-align:-3px; display:inline-block;}
.stat-good{background:#ECFDF3;} .stat-good .num{color:#15803D;}
.stat-bad{background:#FEF2F2;} .stat-bad .num{color:#B91C1C;}
.stat-neutral{background:#EEF2FF;} .stat-neutral .num{color:#3730A3;}
.stat-info{background:#F0F9FF;} .stat-info .num{color:#0369A1;}
.stat-warning{background:#FFFBEB;} .stat-warning .num{color:#B45309;}
.stat-two{background:#ECFEFF;} .stat-two .num{color:#0E7490;}
.stat-four{background:#FEF2F2;} .stat-four .num{color:#B91C1C;}
.stat-cash{background:#FFFBEB;} .stat-cash .num{color:#B45309;}
.stat-bank{background:#EFF6FF;} .stat-bank .num{color:#1D4ED8;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; padding:9px 10px; white-space:nowrap;
  font-family:'Inter',sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  background:var(--paper-dark); color:var(--ink-soft); font-weight:700;
}
td{padding:9px 10px; border-bottom:1px solid var(--rule);}
tr:hover td{background:var(--paper-dark);}
.v-input{color:#1D4ED8;}
.v-formula{color:var(--ink);}
.floor-1{background:#FBEAEA;} .floor-1 .contact{color:#B33A2E;}
.floor-2{background:#EAF1FB;} .floor-2 .contact{color:#1D5FA8;}
.floor-3{background:#EDF6EA;} .floor-3 .contact{color:#3E8C2E;}
.floor-4{background:#FCEFE4;} .floor-4 .contact{color:#B35A18;}
.floor-5{background:#F0EBF8;} .floor-5 .contact{color:#5D3EA8;}
.floor-6{background:#FFF8E3;} .floor-6 .contact{color:#B3860A;}
.floor-7{background:#E7F3F4;} .floor-7 .contact{color:#207E8F;}
.floor-8{background:#FBE9E9;} .floor-8 .contact{color:#B32626;}
.floor-9{background:#E9F1FA;} .floor-9 .contact{color:#1D5FA8;}
.floor-10{background:#EBF6E7;} .floor-10 .contact{color:#3E9B2E;}
.floor-11{background:#FCEEE6;} .floor-11 .contact{color:#B34B18;}
.floor-12{background:#F5E9F0;} .floor-12 .contact{color:#A82368;}
.floor-13{background:#E9F5E9;} .floor-13 .contact{color:#278A22;}
.floor-x:hover td,[class*="floor-"]:hover td{filter:brightness(0.97);}
.veh-two{background:#E7F8F8;}
.veh-four{background:#FBE9E8;}
.mobile{font-weight:700; font-size:16px; letter-spacing:.01em; color:var(--maroon);}
.owner-name{font-weight:700; color:var(--ink);}
.flat-no{font-weight:800; font-size:17px;}
.search-safe{
  background:#ECFDF3 !important;
  border:1.5px solid var(--ledger-green) !important;
  font-weight:600;
}
.search-safe::placeholder{color:#4E9F6B;}
.search-safe-label{color:var(--ledger-green) !important; font-weight:700;}
.vnum{font-weight:700; font-size:16.5px; letter-spacing:.03em;}
.type-two{color:#0E7490; font-weight:600;}
.type-four{color:#B91C1C; font-weight:600;}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,22,43,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px;
}
.modal-box{
  background:var(--white-card); border:1px solid var(--rule); border-radius:18px; padding:22px 24px;
  max-width:360px; width:100%; box-shadow:var(--shadow-lg);
}
.modal-box h3{margin-bottom:10px;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

/* ---- Bottom navigation bar (mobile-app style) ---- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  max-width:920px; margin:0 auto;
  display:flex; align-items:stretch;
  background:rgba(255,255,255,.97); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--rule); box-shadow:var(--shadow-lg);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:6px 2px; border-radius:var(--radius-sm); cursor:pointer; position:relative;
  font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; color:var(--ink-soft);
  background:none; border:none; -webkit-tap-highlight-color:transparent; transition:color .15s ease;
}
.nav-item .nav-icon{
  font-size:20px; line-height:1; width:34px; height:26px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; transition:background .15s ease, transform .15s ease;
}
.nav-item .nav-label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.nav-item.active{color:var(--maroon);}
.nav-item.active .nav-icon{background:#EEF2FF; transform:translateY(-1px);}
.nav-more{position:relative;}
.more-menu{
  position:absolute; bottom:calc(100% + 12px); right:-6px; min-width:190px;
  background:var(--white-card); border:1px solid var(--rule); border-radius:14px;
  box-shadow:var(--shadow-lg); padding:6px; z-index:70;
  display:none; flex-direction:column; gap:2px;
}
.more-menu.open{display:flex;}
.more-menu-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink);
  cursor:pointer; text-align:left; white-space:nowrap;
}
.more-menu-item .nav-icon{font-size:16px; width:auto; height:auto; background:none;}
.more-menu-item:hover{background:var(--paper-dark);}
.more-menu-item.active{background:#EEF2FF; color:var(--maroon);}
.form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px;}
.form-row .field{flex:1; min-width:140px; margin-bottom:0;}
.msg{padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:13.5px;}
.msg.error{background:#FEF2F2; border:1px solid #FCC; color:var(--danger);}
.msg.ok{background:#ECFDF3; border:1px solid #BBF0D0; color:#15803D;}
.empty{color:var(--ink-soft); font-style:italic; padding:14px 0;}
.pill{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:3px 10px; border-radius:999px;
  border:1.5px solid currentColor; display:inline-block;
}
.pill.sold{color:#15803D; background:#ECFDF3;}
.pill.unsold{color:var(--ink-soft); background:var(--paper-dark);}
.pill-select{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:3px 8px; border-radius:999px;
  border:1.5px solid currentColor; background:transparent; cursor:pointer;
}
.pill-select.sold{color:#15803D;}
.pill-select.unsold{color:var(--ink-soft);}
.config-note{font-size:12px; color:var(--ink-soft); margin-top:6px;}
.bell-wrap{position:relative; display:inline-block; font-size:28px; line-height:1; cursor:pointer; color:#fff; padding:4px; -webkit-tap-highlight-color:transparent;}
.notif-badge{position:absolute; top:-6px; right:-8px; background:#DC2626; color:#fff; font-size:11px; font-weight:800; min-width:19px; height:19px; border-radius:999px; display:none; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--maroon-dark);}
@keyframes bellShake{
  0%, 100% { transform: rotate(0deg); }
  10%, 30%, 50%, 70% { transform: rotate(-14deg); }
  20%, 40%, 60%, 80% { transform: rotate(14deg); }
  90% { transform: rotate(-4deg); }
}
.bell-wrap.has-notif{ animation: bellShake 1.8s ease-in-out infinite; transform-origin: 50% 0%; }
.notif-panel{position:fixed; width:300px; max-width:85vw; max-height:360px; overflow-y:auto; background:var(--white-card); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow-lg); padding:6px; z-index:90; text-align:left;}
.notif-item{padding:10px; border-bottom:1px solid var(--rule); font-size:13px; color:var(--ink); font-weight:600;}
.notif-item:last-child{border-bottom:none;}
.accordion-header{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; padding:2px 0; -webkit-tap-highlight-color:transparent;}
.accordion-header h3{margin:0;}
.accordion-caret{font-size:13px; font-weight:800; color:var(--maroon); background:#EEF2FF; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.floor-card h3{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px;}
.floor-heading-center{justify-content:center; text-align:center; width:100%;}
.flat-entry{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--rule);}
.flat-entry:last-child{border-bottom:none;}
.flat-chip{color:#fff; font-weight:800; padding:4px 12px; border:none; font-size:13px;}
.flat-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto;}
a{color:var(--maroon);}

@media (max-width:600px){
  .app{padding:12px; padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));}
  .hero-banner{margin:-12px -12px 16px; padding:16px 14px 14px;}
  .hero-banner h1{font-size:18px;}
  .hero-banner .eyebrow{font-size:10px;}
  .card{padding:14px; border-radius:14px;}
  .grid-stats{gap:8px;}
  .stat{flex:1 1 calc(33.333% - 6px); min-width:0; padding:8px 6px; text-align:center;}
  .stat .num{font-size:15px;}
  .stat .lbl{font-size:9px; line-height:1.25; margin-top:2px;}
  .lbl-icon{font-size:12px; margin-right:2px; vertical-align:-2px;}
  th, td{padding:8px 8px; font-size:12.5px;}
  .form-row{flex-direction:column; align-items:stretch; gap:12px;}
  .form-row .field{width:100%; min-width:0;}
  .form-row .field[style*="flex:0"]{width:100%;}
  .form-row button{width:100%;}
  .form-row.form-row-pair{flex-direction:row; gap:10px;}
  .form-row.form-row-pair .field{width:auto; flex:1 1 0;}
  .grid-stats-2col .stat{flex:1 1 calc(50% - 4px);}
}

/* ---- PC view ----
   Same single page, different shape once there is real width: the nav moves
   from the thumb's reach at the bottom to a bar across the top, and result
   cards stop being a one-file column and fill the screen in a grid. The card
   markup is untouched — only where things sit changes. */
@media (min-width:900px){
  .bottom-nav{
    top:0; bottom:auto; max-width:none; width:100%; justify-content:center; gap:6px;
    padding:10px 24px; border-top:none; border-bottom:1px solid var(--rule);
    box-shadow:0 2px 14px rgba(20,22,43,.06);
  }
  .nav-item{
    flex:0 0 auto; flex-direction:row; gap:10px; padding:13px 30px; font-size:15.5px;
    border-radius:12px;
  }
  .nav-item:hover{background:var(--paper-dark);}
  .nav-item .nav-icon{width:auto; height:auto; font-size:21px; border-radius:8px; padding:0;}
  .nav-item.active{background:#EEF2FF;}
  .nav-item.active .nav-icon{background:none; transform:none;}
  .nav-more{margin-left:8px;}
  .more-menu{top:calc(100% + 10px); bottom:auto; right:0;}
  .more-menu-item{font-size:15px; padding:12px 15px;}

  /* Poori screen use karo — bade monitor par bhi dono taraf khaali patti nahi. */
  .app{max-width:none; padding:88px 28px 48px;}
  .hero-banner{
    margin:12px 0 22px; border-radius:22px; padding:24px 28px 26px;
  }
  .hero-banner h1{font-size:25px;}

  /* ---- Ek row me ek product — Products aur Search dono me ----
     Photo → naam → unit weight → item dimension → item box dimension → box.
     Card ko grid ki tarah tukdon me baantne ke bajaye poori chaudai ki ek
     line bana diya, taaki aankh ek hi patti par baaein se daaein chale.
     Jis product ke kai box hain unke box aakhri khaane me neeche neeche
     lagte hain — us product ki row utni hi oonchi ho jaati hai, list ka
     baaki dhaancha waisa hi rehta hai. */
  #products-list .prod-card, #search-results .prod-card{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; margin-bottom:10px; overflow:hidden;
  }
  /* Har khaana sikud sakta hai. 1280px ke laptop par bhi poori row ek hi
     line me aani chahiye — pehle fixed chaudai thi to card ke andar hi
     scrollbar aa jaata tha aur Edit/Delete kat jaate the. */
  #products-list .prod-card h3, #search-results .prod-card h3{
    flex:1 1 170px; min-width:130px; margin:0; font-size:15px; gap:9px;
  }

<body>
<div id="root"><div class="app"><div class="empty">Loading&hellip;</div></div></div>
<script>
/* ============================================================
   PRODUCT BOX SIZE — single-file app.
   Mirrors the "Product Box Dimension" xlsm sheet:
     Product Name | Box Weight | Box Dimension | Unit in Box |
     Unit Weight | FBA Unit | FBA Weight | Item Dimension |
     Item Box Dimension
   Box Weight and FBA Weight are never stored — they are the
   sheet's own formulas (=D*E and =E*F) recomputed on screen,
   so they can never drift out of sync with the numbers.
   ============================================================ */
const SUPABASE_URL = "https://genlxypyehcpxatcsiut.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pxE-irYl9twtYkk2UDi38g_NWkaW4jP";
const IMAGE_BUCKET = "pbs-images";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const root = document.getElementById('root');
let state = { user:null, tab:'search' };
let productsCache = [];
let searchTerm = '';
let searchMode = 'box';   // Search tab: 'box' = one product ka poora box, 'mix' = FBA mix
let mixTerm = '';         // Product Mix panel ka apna search box
let mixList = [];         // [{id, units}] — jo shipment abhi count ho raha hai
let editingProductId = null;
let editingBagId = null;
let boxDraft = [];        // rows in the Add/Edit product form's box list
let imageDraft = null;    // image_url currently attached in the form

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- number / text helpers ---------------- */
// Number(null) and Number('') are both 0, which would turn a blank FBA Unit
// or a blank Unit in Box into a confident "0 kg". A blank cell has to stay
// blank, exactly as it does in the sheet.
function num(v){
  if(v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function fmtWt(n){
  if(n === null || n === undefined || n === '' || !Number.isFinite(Number(n))) return null;
  return (Math.round(Number(n)*1000)/1000).toString();
}
function kg(n){ const f = fmtWt(n); return f===null ? null : f + ' kg'; }
function boxWeight(p, b){
  const u = num(b.unit_in_box), w = num(p.unit_weight);
  return (u===null || w===null) ? null : u*w;
}
/* FBA Unit is a scratch number, not a fact about the product — the sheet
   leaves column F empty and it gets typed fresh whenever a part-box goes to
   FBA (a 30-piece box with only 15 pieces going out). So it lives only in
   the Product Mix panel now, per mix row, and a blank reads as 0 rather than
   a dash: that is the answer to "kitna weight jaayega" before anything is
   counted. The Search box card and the Products tab don't show it at all. */
function fbaUnitFor(p){ return p.fba_unit == null ? '' : p.fba_unit; }
function fbaWeight(p, unitsOverride){
  const raw = unitsOverride !== undefined ? unitsOverride : fbaUnitFor(p);
  const f = num(raw), w = num(p.unit_weight);
  if(w === null) return null;
  return (f === null ? 0 : f) * w;
}
/* ---------------- Vyapar stock ----------------
   Vyapar apne naam se chalta hai, ye app apne naam se. Beech me pbs_links
   hai: ek product ke saamne Vyapar ke ek ya kai item. CDSA is baat ki wajah
   hai — sheet me ek hi CDSA hai (sabka weight same), Vyapar me CDSA-HONDA,
   CDSA-HYUNDAI, CDSA-TATA... alag alag. Stock un sabka jod hai, aur Search
   me kuch nahi badalta: wahan sirf ek CDSA hi dikhta rahega. */
let vyaparCache = [];
let vyaparIndex = {};
let linksCache = [];
let vyaparLoaded = false;

async function loadVyapar(force){
  if(vyaparLoaded && !force) return {};
  const [vi, li] = await Promise.all([
    sb.from('pbs_vyapar_items').select('item_name, current_stock, is_active, synced_at').order('item_name'),
    sb.from('pbs_links').select('id, product_id, pattern, is_prefix')
  ]);
  if(vi.error) return {error: vi.error};
  if(li.error) return {error: li.error};
  vyaparCache = vi.data || [];
  linksCache  = li.data || [];
  vyaparIndex = {};
  vyaparCache.forEach(v => { vyaparIndex[v.item_name.toLowerCase()] = v; });
  vyaparLoaded = true;
  return {};
}
function lastSyncedAt(){
  const v = vyaparCache.find(x => x.synced_at);
  return v ? new Date(v.synced_at) : null;
}
function linksFor(productId){ return linksCache.filter(l => l.product_id === productId); }
/* Ek product ke peeche jitne Vyapar item hain, unki poori list.
   is_prefix wala rule naye variant apne aap pakad leta hai. */
function vyaparRowsFor(productId){
  const out = [], seen = {};
  linksFor(productId).forEach(l=>{
    if(l.is_prefix){
      const pre = String(l.pattern).toLowerCase();
      vyaparCache.forEach(v=>{
        if(v.item_name.toLowerCase().startsWith(pre) && !seen[v.item_name]){ seen[v.item_name]=1; out.push(v); }
      });
    } else {
      const v = vyaparIndex[String(l.pattern).toLowerCase()];
      if(v && !seen[v.item_name]){ seen[v.item_name]=1; out.push(v); }
    }
  });
  return out;
}
function stockFor(productId){
  const rows = vyaparRowsFor(productId);
  if(!rows.length) return null;                       // joda hi nahi gaya — 0 mat dikhao
  return rows.reduce((s,v) => s + (num(v.current_stock) || 0), 0);
}
function fmtQty(n){ return n === null || n === undefined ? '—' : Number(n).toLocaleString('en-IN'); }

function friendlyDbError(error){
  if(!error) return '';
  const m = (error.message||'').toLowerCase();
  if(m.includes('does not exist') || m.includes('could not find the table')
     || error.code === '42P01' || error.code === 'PGRST205')
    return 'Database table abhi bani nahi hai. Settings tab kholo, "Setup SQL Copy Karo" dabao aur Supabase SQL Editor me ek baar chala do.';
  if(m.includes('bucket not found'))
    return 'Image bucket abhi bana nahi hai. Settings ka Setup SQL ek baar chala do.';
  if(m.includes('duplicate key')) return 'Ye product name pehle se list me hai.';
  if(m.includes('row-level security') || m.includes('permission'))
    return 'Ye change karne ki permission nahi hai — PIN se Unlock karo.';
  if(m.includes('failed to fetch')) return 'Internet nahi mil raha. Connection check karke firse try karo.';
  return error.message || 'Kuch gadbad hui.';
}
function toast(msg, kind){
  const old = document.getElementById('app-toast'); if(old) old.remove();
  const t = el('<div id="app-toast" style="position:fixed; left:50%; transform:translateX(-50%);' +
    'bottom:calc(var(--nav-h) + 22px); z-index:1200; max-width:88vw; text-align:center;' +
    'background:' + (kind==='error'?'var(--danger)':'#15803D') + '; color:#fff; font-weight:600; font-size:13.5px;' +
    'padding:11px 18px; border-radius:12px; box-shadow:var(--shadow-lg);">' + esc(msg) + '</div>');
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3600);
}

/* ---------------- Settings (device-local) ---------------- */
const THEME_KEY = 'pbs_theme';
const DEFAULT_TAB_KEY = 'pbs_default_tab';
function getTheme(){ return localStorage.getItem(THEME_KEY) || 'auto'; }
function applyTheme(){
  const theme = getTheme();
  const resolved = theme === 'auto'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : theme;
  document.documentElement.setAttribute('data-theme', resolved);
}
function setTheme(theme){ localStorage.setItem(THEME_KEY, theme); applyTheme(); render(); }
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(getTheme()==='auto') applyTheme(); });
function getDefaultTab(){ return localStorage.getItem(DEFAULT_TAB_KEY) || 'search'; }
function setDefaultTab(k){ localStorage.setItem(DEFAULT_TAB_KEY, k); }

/* Reload should leave you where you were standing, not throw you back to
   Search. sessionStorage is the right shelf for that: it survives F5 in this
   tab and dies with the tab, so opening the app fresh still honours the
   "app khulte hi kaunsa tab" setting. */
const LAST_TAB_KEY = 'pbs_last_tab';
const LAST_MODE_KEY = 'pbs_last_search_mode';
function rememberTab(k){ try{ sessionStorage.setItem(LAST_TAB_KEY, k); }catch(_){} }
function openingTab(){
  let last = null;
  try{ last = sessionStorage.getItem(LAST_TAB_KEY); }catch(_){}
  return (last && TABS.some(([k])=>k===last)) ? last : getDefaultTab();
}
/* Mix banate waqt reload karne par Product Box par pahunch jaate the, jabki
   mix waise ka waisa bacha hua hota tha. Mode bhi tab ke saath yaad rehta
   hai — tab ki tarah hi, sirf is browser tab ke liye. */
function rememberSearchMode(m){ try{ sessionStorage.setItem(LAST_MODE_KEY, m); }catch(_){} }
function openingSearchMode(){
  let m = null;
  try{ m = sessionStorage.getItem(LAST_MODE_KEY); }catch(_){}
  return m === 'mix' ? 'mix' : 'box';
}

/* ---------------- PIN-gated WRITE access ----------------
   Search and viewing are open to anyone who has the link.
   Add / Edit / Delete ask for a PIN once per device and stay
   unlocked until "Lock" is pressed.

   NOTE ON WHAT THIS PIN IS AND ISN'T: it guards against a
   stray tap on a shared phone, not against someone determined
   to reach the database — the Supabase row policies for this
   app allow writes from the public key that ships in this
   file. Treat the app link the same way you would treat the
   spreadsheet it replaced: fine inside the team, not public. */
/* REQUIRE_PIN is the one switch. While it is false the app is fully open:
   no PIN prompt, no Unlock/Lock button, every tab reachable. Flip it back to
   true and the whole gate below comes back exactly as it was — nothing else
   needs touching. Left off on purpose while the app is still being shaped. */
const REQUIRE_PIN = false;
const ADMIN_PIN = "1201";
const PIN_UNLOCK_KEY = "pbs_pin_unlocked";

function pinStillValid(){ return localStorage.getItem(PIN_UNLOCK_KEY) === "true"; }
function unlocked(){ return REQUIRE_PIN ? pinStillValid() : true; }

let pinActionInFlight = false;
async function withPin(action){
  if(pinActionInFlight) return;
  const guarded = async ()=>{
    pinActionInFlight = true;
    try{ await action(); } finally{ pinActionInFlight = false; }
  };
  if(!REQUIRE_PIN || pinStillValid()){ await guarded(); return; }
  showPinModal(guarded);
}
function showPinModal(action){
  const old = document.getElementById('pin-modal'); if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="pin-modal">
    <div class="modal-box">
      <h3>Enter PIN</h3>
      <p class="config-note">Add / Edit / Delete karne ke liye zaroori hai. Lock dabane tak is device par unlock rahega.</p>
      <div id="pin-modal-msg"></div>
      <input id="pin-modal-input" type="password" inputmode="numeric" maxlength="6" style="width:100%; letter-spacing:.3em; text-align:center; font-size:20px" autofocus>
      <div class="modal-actions">
        <button onclick="document.getElementById('pin-modal').remove(); render();">Cancel</button>
        <button class="primary" id="pin-modal-submit">Unlock</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const submit = async ()=>{
    const pin = document.getElementById('pin-modal-input').value.trim();
    const msgBox = document.getElementById('pin-modal-msg');
    if(pin !== ADMIN_PIN){ msgBox.innerHTML = '<div class="msg error">Wrong PIN.</div>'; return; }
    localStorage.setItem(PIN_UNLOCK_KEY, "true");
    overlay.remove();
    await action();
  };
  document.getElementById('pin-modal-submit').onclick = submit;
  document.getElementById('pin-modal-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}
async function unlockOnly(){ await withPin(async ()=>{ render(); }); }
async function lockNow(){
  localStorage.removeItem(PIN_UNLOCK_KEY);
  editingProductId = null; editingBagId = null; boxDraft = []; imageDraft = null;
  if(HIDDEN_TAB_KEYS.includes(state.tab)) state.tab = 'search';
  render();
}
/* Tapping any input (except the green search boxes) asks for the PIN
   up front, so nobody starts typing into a form they can't save. */
document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t.tagName === 'INPUT' && t.type !== 'file' && t.id !== 'pin-modal-input'
     && !t.classList.contains('search-safe') && !t.classList.contains('calc-safe')
     && !unlocked()){
    t.blur();
    showPinModal(async ()=>{ render(); });
  }
});

/* ---------------- data loading ---------------- */
async function loadProducts(){
  const {data, error} = await sb
    .from('pbs_products')
    .select('id, name, unit_weight, fba_unit, item_dimension, item_box_dimension, notes, image_url, pbs_boxes(id, box_dimension, unit_in_box, sort_order)')
    .order('name');
  if(error) return {error};
  (data||[]).forEach(p=>{
    p.pbs_boxes = (p.pbs_boxes||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  });
  productsCache = data || [];
  return {data: productsCache};
}

/* ---------------- product image ---------------- */
async function uploadProductImage(file){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = 'prod_' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const {error} = await sb.storage.from(IMAGE_BUCKET).upload(path, file, {cacheControl:'3600', upsert:false});
  if(error){ toast('Photo upload nahi hua: ' + friendlyDbError(error), 'error'); return null; }
  const {data} = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}
async function onProductImagePick(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast('Sirf image file chalegi.', 'error'); input.value=''; return; }
  if(file.size > 8*1024*1024){ toast('Photo 8 MB se choti honi chahiye.', 'error'); input.value=''; return; }
  const btn = document.getElementById('img-pick-label');
  if(btn) btn.textContent = 'Uploading…';
  const url = await uploadProductImage(file);
  if(url){ imageDraft = url; toast('Photo lag gayi.'); }
  input.value = '';
  renderImagePicker();
}
function clearProductImage(){ imageDraft = null; renderImagePicker(); }
function renderImagePicker(){
  const wrap = document.getElementById('img-picker');
  if(!wrap) return;
  wrap.innerHTML = (imageDraft
      ? `<div class="img-preview-wrap">
           <img src="${esc(imageDraft)}" alt="">
           <div style="flex:1; min-width:0;">
             <div class="config-note" style="margin:0">Photo lagi hui hai.</div>
           </div>
           <button class="danger" onclick="clearProductImage()" style="min-height:38px; padding:7px 12px;">✕ Hatao</button>
         </div>`
      : '') +
    `<label class="file-btn" id="img-pick-label" for="p_img">📷 ${imageDraft ? 'Photo Badlo' : 'Product Photo Upload Karo'}</label>
     <input id="p_img" type="file" accept="image/*" style="display:none" onchange="onProductImagePick(this)">`;
}
/* The photo viewer pushes a history entry, so the phone's Back button closes
   the photo instead of walking out of the app — on Android that back press
   was landing outside the PWA entirely. Tapping the photo closes it the same
   way (history.back), so both routes leave the history depth where it was. */
let lightboxOpen = false;
function openLightbox(url){
  if(lightboxOpen) return;
  const box = el('<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img src="' + esc(url) + '" alt=""></div>');
  document.body.appendChild(box);
  lightboxOpen = true;
  history.pushState({pbsLightbox:true}, '');
}
function closeLightbox(){
  const box = document.getElementById('lightbox');
  if(box) box.remove();
  if(!lightboxOpen) return;
  lightboxOpen = false;
  if(history.state && history.state.pbsLightbox) history.back();
}
window.addEventListener('popstate', ()=>{
  if(!lightboxOpen) return;   // Back press: entry already gone, just close the photo
  lightboxOpen = false;
  const box = document.getElementById('lightbox');
  if(box) box.remove();
});

/* ---------------- shared product card ---------------- */
function markHit(text, term){
  const s = String(text==null?'':text);
  if(!term) return esc(s);
  const i = s.toLowerCase().indexOf(term.toLowerCase());
  if(i < 0) return esc(s);
  return esc(s.slice(0,i)) + '<span class="hit">' + esc(s.slice(i, i+term.length)) + '</span>' + esc(s.slice(i+term.length));
}
function specHtml(label, value, cls){
  const blank = (value === null || value === undefined || value === '');
  return '<div class="spec"><div class="k">' + esc(label) + '</div>' +
    '<div class="v ' + (blank ? 'blank' : (cls||'')) + '">' + (blank ? '—' : esc(value)) + '</div></div>';
}
function productCardHtml(p, opts){
  opts = opts || {};
  const term = opts.term || '';
  const boxes = p.pbs_boxes || [];
  return `<div class="card prod-card">
    <h3>
      ${p.image_url ? `<img class="prod-thumb" src="${esc(p.image_url)}" alt="" onclick="openLightbox('${esc(p.image_url)}')">` : ''}
      <span class="name">${markHit(p.name, term)}</span>
      ${boxes.length > 1 ? `<span class="pill" style="background:#FFF7ED; border-color:#F3D9BC; color:#B45309; font-size:11px;">${boxes.length} box sizes</span>` : ''}
    </h3>
    <div class="spec-grid">
      ${specHtml('Unit Weight', kg(p.unit_weight))}
      ${opts.itemDims === false ? '' :
        specHtml('Item Dimension', p.item_dimension, 'dim') +
        specHtml('Item Box Dimension', p.item_box_dimension, 'dim')}
      ${p.notes ? specHtml('Note', p.notes) : ''}
    </div>
    <div class="box-col">
      <div class="box-stack">
        ${boxes.length ? boxes.map((b,i)=>`<div class="box-line">
            ${boxes.length > 1 ? `<span class="box-index">${i+1}</span>` : '<span class="lbl-icon">📦</span>'}
            <span class="bx-dim">${b.box_dimension ? esc(b.box_dimension) : '—'}</span>
            <span class="bx-sep">×</span>
            <span class="bx-units">${b.unit_in_box == null ? '—' : esc(b.unit_in_box)} unit</span>
            <span class="bx-wt">${kg(boxWeight(p,b)) || '—'}</span>
          </div>`).join('')
          : `<div class="box-line"><span class="lbl-icon">📦</span><span class="bx-dim">—</span>
             <span class="bx-sep">box detail baaki hai</span></div>`}
      </div>
      ${opts.stock ? `<div class="stock-wrap">${stockLineHtml(p)}</div>` : ''}
    </div>
    ${opts.editable ? `<div class="prod-actions">
        <button onclick="editProduct(${p.id})">✏️ Edit</button>
        <button class="danger" onclick="deleteProduct(${p.id})">🗑️</button>
      </div>` : ''}
  </div>`;
}
function stockLineHtml(p){
  const rows = vyaparRowsFor(p.id);
  if(!rows.length){
    return `<div class="stock-line zero" onclick="setTab('vyapar')">
      <span class="lbl-icon">🔗</span>
      <span class="st-qty">Vyapar se juda nahi</span>
      <span class="st-sub">jodne ke liye dabao</span>
    </div>`;
  }
  const total = stockFor(p.id);
  return `<div class="stock-line ${total > 0 ? '' : 'zero'}" onclick="toggleStockParts(${p.id})">
      <span class="lbl-icon">📊</span>
      <span class="st-qty">${fmtQty(total)}</span>
      <span style="font-size:12px; color:var(--ink-soft)">stock</span>
      <span class="st-sub">${rows.length > 1 ? rows.length + ' item ▾' : 'Vyapar'}</span>
    </div>
    ${rows.length > 1 ? `<div class="stock-parts" id="stockparts_${p.id}" style="display:none">
      ${rows.map(v=>`<div class="stock-part">
        <span class="sp-name">${esc(v.item_name)}</span>
        <span class="sp-qty">${fmtQty(v.current_stock)}</span>
      </div>`).join('')}
    </div>` : ''}`;
}
function toggleStockParts(id){
  const b = document.getElementById('stockparts_' + id);
  if(b) b.style.display = b.style.display === 'none' ? '' : 'none';
}

const BOX_LOGO = `<svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#A67954" stroke-width="2.6" stroke-linejoin="round">

function topbar(){

async function render(){
  if(HIDDEN_TAB_KEYS.includes(state.tab) && !NO_PIN_MORE_TABS.includes(state.tab) && !unlocked()){
    state.tab = 'search';
  }
  const primary = TABS.filter(([k])=> !HIDDEN_TAB_KEYS.includes(k));

    <div class="nav-item nav-more ${onSecondary?'active':''}" onclick="toggleMoreMenu(event)">

      <div class="more-menu" id="more-menu">

function setTab(k){

}
function toggleMoreMenu(e){ e.stopPropagation(); const m=document.getElementById('more-menu'); if(m) m.classList.toggle('open'); }
function closeMoreMenu(){ const m=document.getElementById('more-menu'); if(m) m.classList.remove('open'); }
document.addEventListener('click', (e)=>{
  const menu = document.getElementById('more-menu');
  if(menu && menu.classList.contains('open') && !e.target.closest('.nav-more')) menu.classList.remove('open');
});
async function onMoreTabSelect(k){
  if(!k) return;
  if(NO_PIN_MORE_TABS.includes(k)){ state.tab = k; rememberTab(k); render(); return; }
  await withPin(async ()=>{ state.tab = k; rememberTab(k); render(); });
}
function toggleAccordion(id){
  const body = document.getElementById(id+'_body');
  const caret = document.getElementById(id+'_caret');
  if(!body) return;
  const willOpen = body.style.display === 'none';
  body.style.display = willOpen ? '' : 'none';
  if(caret) caret.textContent = willOpen ? '▴' : '▾';
}
function openAccordion(id){
  const body = document.getElementById(id+'_body');
  const caret = document.getElementById(id+'_caret');
  if(body) body.style.display = '';
  if(caret) caret.textContent = '▴';
}
async function renderTabContent(){
  const box = document.getElementById('tab-content');
  if(!box) return;
  try{
    if(state.tab==='search')   return await renderSearchTab(box);
    if(state.tab==='products') return await renderProductsTab(box);
    if(state.tab==='bags')     return await renderBagsTab(box);
    if(state.tab==='vyapar')   return await renderVyaparTab(box);
    if(state.tab==='deleted')  return await renderDeletedTab(box);
    if(state.tab==='settings') return await renderSettingsTab(box);
  }catch(err){
    console.error(err);
    box.innerHTML = '<div class="msg error"><b>Something broke:</b> ' + esc(err.message || err) + '</div>';

/* ---------------- SEARCH tab ----------------
   Two ways of asking, one switch between them:
     Product Box — ek product, uska poora box detail (sheet jaisa).
     Product Mix — kai product ek saath, FBA ka total weight.
   FBA Unit sirf Mix me hai; box wale card par aur Products tab par nahi,
   kyunki wo number product ka nahi, us shipment ka hota hai. */
async function renderSearchTab(box){
  const {error} = await loadProducts();
  box.innerHTML = `
    <div class="segmented">
      <button id="seg-box" class="${searchMode==='box'?'on':''}" onclick="setSearchMode('box')">📦 Product Box</button>
      <button id="seg-mix" class="${searchMode==='mix'?'on':''}" onclick="setSearchMode('mix')">🧮 Product Mix${mixList.length?' ('+mixList.length+')':''}</button>
    </div>
    ${error?`<div class="msg error">${esc(friendlyDbError(error))}</div>`:''}
    <div id="search-panel"></div>`;
  paintSearchPanel();
}
function setSearchMode(m){
  searchMode = m;
  rememberSearchMode(m);
  const b = document.getElementById('seg-box'), x = document.getElementById('seg-mix');
  if(b) b.classList.toggle('on', m === 'box');
  if(x) x.classList.toggle('on', m === 'mix');
  paintSearchPanel();
}
function paintSearchPanel(){
  const panel = document.getElementById('search-panel');
  if(!panel) return;
  if(searchMode === 'mix') paintMixPanel(panel);
  else paintBoxPanel(panel);
}
function paintBoxPanel(panel){
  panel.innerHTML = `
    <div class="card sticky-search">
      <div class="big-search">
        <span class="mag">🔍</span>
        <input id="q" class="search-safe" placeholder="Product ka naam type karo…" value="${esc(searchTerm)}" autocomplete="off">
      </div>
      <p class="config-note" style="margin:10px 0 0; text-align:center;">
        Sheet ke SEARCH box jaisa hi — naam type karte hi poora box detail aa jayega.
      </p>
    </div>
    <div id="search-results"></div>`;
  const input = document.getElementById('q');
  input.addEventListener('input', ()=>{ searchTerm = input.value; paintSearchResults(); });
  paintSearchResults();
}
function matchProduct(p, t){
  if(!t) return false;
  const hay = [p.name, p.item_dimension, p.item_box_dimension, p.notes]
    .concat((p.pbs_boxes||[]).map(b=>b.box_dimension));
  return hay.some(v => v && String(v).toLowerCase().includes(t));
}
function paintSearchResults(){
  const wrap = document.getElementById('search-results');
  if(!wrap) return;
  const t = searchTerm.trim().toLowerCase();
  if(!t){
    wrap.innerHTML = `<div class="card"><p class="empty">
      Upar naam likhte hi us product ka box size, unit in box, unit weight aur FBA detail dikhega.<br>
      Total ${productsCache.length} product list me hain.</p></div>`;
    return;
  }
  const hits = productsCache.filter(p => matchProduct(p, t));
  wrap.innerHTML = hits.length
    ? `<p class="result-count">${hits.length} result${hits.length>1?'s':''}</p>` +
      hits.map(p=>productCardHtml(p, {term: searchTerm.trim(), itemDims:false})).join('')
    : `<div class="card"><p class="empty">"${esc(searchTerm)}" naam ka koi product nahi mila.</p></div>`;
}

/* ---------------- Product Mix (FBA) ----------------
   A mix is built over minutes while someone walks the shelves, so it
   survives a refresh in localStorage — losing a half-counted shipment to
   an accidental reload would be the worst part of doing this on a phone. */
const MIX_KEY = 'pbs_fba_mix';
function loadMix(){
  try{
    const raw = JSON.parse(localStorage.getItem(MIX_KEY) || '[]');
    mixList = Array.isArray(raw) ? raw.filter(r => r && r.id != null) : [];
  }catch(_){ mixList = []; }
}
function saveMix(){ try{ localStorage.setItem(MIX_KEY, JSON.stringify(mixList)); }catch(_){} }
function refreshMixBadge(){
  const x = document.getElementById('seg-mix');
  if(x) x.textContent = '🧮 Product Mix' + (mixList.length ? ' (' + mixList.length + ')' : '');
}
function paintMixPanel(panel){
  panel.innerHTML = `
    <div class="card sticky-search">
      <div class="big-search">
        <span class="mag">🔍</span>
        <input id="mixq" class="search-safe" placeholder="Product dhundo aur mix me daalo…" value="${esc(mixTerm)}" autocomplete="off">
      </div>
      <p class="config-note" style="margin:10px 0 0; text-align:center;">
        Jitne product FBA me ja rahe hain sab add karo — har ek ka unit likhte hi total weight jud jayega.
      </p>
      <div id="mix-hits"></div>
    </div>
    <div id="mix-list"></div>`;
  const input = document.getElementById('mixq');
  input.addEventListener('input', ()=>{ mixTerm = input.value; paintMixHits(); });
  paintMixHits();
  paintMixList();
}
function unitWeightLine(p){
  const w = kg(p.unit_weight);
  return '<span class="mx-sub">' + (w ? esc(w) + ' / unit' : 'unit weight bhara nahi hai') + '</span>';
}
function paintMixHits(){
  const wrap = document.getElementById('mix-hits');
  if(!wrap) return;
  const t = mixTerm.trim().toLowerCase();
  if(!t){ wrap.innerHTML = ''; return; }
  const hits = productsCache.filter(p => matchProduct(p, t)).slice(0, 15);
  if(!hits.length){
    wrap.innerHTML = `<p class="empty" style="text-align:center">"${esc(mixTerm)}" naam ka koi product nahi mila.</p>`;
    return;
  }
  wrap.innerHTML = hits.map(p=>`<div class="add-hit">
      <span class="ah-name">${markHit(p.name, mixTerm.trim())}${unitWeightLine(p)}</span>
      ${mixList.some(r=>r.id===p.id)
        ? '<span class="pill sold">✓ Mix me hai</span>'
        : `<button class="primary" onclick="addToMix(${p.id})">+ Add</button>`}
    </div>`).join('');
}
function addToMix(id){
  if(mixList.some(r => r.id === id)) return;
  mixList.push({id, units: 1});   // 1 se shuru, taaki total turant matlab rakhe
  saveMix(); refreshMixBadge(); paintMixHits(); paintMixList();
}
function removeFromMix(id){
  mixList = mixList.filter(r => r.id !== id);
  saveMix(); refreshMixBadge(); paintMixHits(); paintMixList();
}
function clearMix(){
  if(!mixList.length) return;
  if(!confirm('Poora mix hata dein?')) return;
  mixList = [];
  saveMix(); refreshMixBadge(); paintMixHits(); paintMixList();
}
function onMixUnits(id, val){
  const row = mixList.find(r => r.id === id);
  if(!row) return;
  row.units = val;
  saveMix();
  const p = productsCache.find(x => x.id === id);
  const out = document.getElementById('mixwt_' + id);
  if(p && out) out.textContent = kg(fbaWeight(p, val)) || '—';
  paintMixTotal();
}
function paintMixList(){
  const wrap = document.getElementById('mix-list');
  if(!wrap) return;
  if(!mixList.length){
    wrap.innerHTML = `<div class="card"><p class="empty">
      Mix abhi khaali hai. Upar naam dhundo aur "+ Add" dabao — har product ka
      FBA unit likhte hi sabka total weight neeche jud jayega.</p></div>`;
    return;
  }
  const rows = mixList.map(r=>{
    const p = productsCache.find(x => x.id === r.id);
    if(!p) return '';
    return `<div class="mix-row">
      <span class="mx-name">${esc(p.name)}${unitWeightLine(p)}</span>
      <input class="mix-qty calc-safe" type="number" step="1" min="0" inputmode="numeric"
             value="${esc(r.units)}" oninput="onMixUnits(${p.id}, this.value)">
      <span class="mx-wt" id="mixwt_${p.id}">${kg(fbaWeight(p, r.units)) || '—'}</span>
      <button class="mx-del" onclick="removeFromMix(${p.id})">✕</button>
    </div>`;
  }).join('');
  wrap.innerHTML = `<div class="card">
    <div class="mix-head">
      <h3>🧮 FBA Mix</h3>
      <button onclick="clearMix()">Sab hatao</button>
    </div>
    ${rows}
    <div id="mix-total"></div>
  </div>`;
  paintMixTotal();
}
function paintMixTotal(){
  const wrap = document.getElementById('mix-total');
  if(!wrap) return;
  let weight = 0, units = 0, unknown = 0;
  mixList.forEach(r=>{
    const p = productsCache.find(x => x.id === r.id);
    if(!p) return;
    const u = Math.max(0, num(r.units) || 0);
    units += u;
    const w = num(p.unit_weight);
    // Ek bhi product ka unit weight blank ho to uska weight guess nahi karte —
    // total ke neeche saaf likh dete hain ki wo isme joda nahi gaya.
    if(w === null){ if(u > 0) unknown++; }
    else weight += u * w;
  });
  wrap.innerHTML = `<div class="mix-total">
      <span>

/* Ek hi form do jagah kaam aata hai: upar "Add Product" me, aur Edit dabane
   par usi product ki apni row me. Isliye markup ek hi jagah likha hai. */

function paintProductsList(){
  const wrap = document.getElementById('products-list');
  if(!wrap) return;
  const t = (document.getElementById('plist_q')?.value || '').trim().toLowerCase();
  // Jis product ko edit kar rahe hain wo list me bana rehta hai, chahe search
  // se mel na khaye — warna form beech kaam me gayab ho jaata.
  const list = t ? productsCache.filter(p => matchProduct(p,t) || p.id === editingProductId) : productsCache;
  const editing = editingProductId ? productsCache.find(p=>p.id===editingProductId) : null;
  wrap.innerHTML = `<p class="result-count">${list.length} of ${productsCache.length} products</p>` +
    (list.length
      ? list.map(p => p.id === editingProductId
          ? `<div class="card edit-inline"><h3>✏️ ${esc(p.name)}</h3>${productFormHtml(editing)}</div>`
          : productCardHtml(p, {editable: unlocked(), term: t, stock: true})).join('')
      : '<div class="card"><p class="empty">Koi product nahi mila.</p></div>');
  if(editing){ renderBoxEditor(); renderImagePicker(); }
}
function renderBoxEditor(){
  const wrap = document.getElementById('box-editor');
  if(!wrap) return;
  if(!boxDraft.length) boxDraft = [{box_dimension:'', unit_in_box:''}];
  wrap.innerHTML = boxDraft.map((b,i)=>`
    <div class="box-editor-row">
      <div class="field"><label>Box Dimension ${boxDraft.length>1?(i+1):''}</label>
        <input value="${esc(b.box_dimension||'')}" placeholder="42x42x43" oninput="boxDraft[${i}].box_dimension=this.value"></div>
      <div class="field"><label>Unit in Box</label>
        <input type="number" step="1" inputmode="numeric" value="${b.unit_in_box==null?'':esc(b.unit_in_box)}"
               placeholder="100" oninput="boxDraft[${i}].unit_in_box=this.value"></div>
      <button class="danger" onclick="removeBoxDraftRow(${i})" title="Remove">✕</button>
    </div>`).join('');
}
function addBoxDraftRow(){ boxDraft.push({box_dimension:'', unit_in_box:''}); renderBoxEditor(); }
function removeBoxDraftRow(i){
  boxDraft.splice(i,1);
  if(!boxDraft.length) boxDraft=[{box_dimension:'',unit_in_box:''}];
  renderBoxEditor();
}
function resetProductForm(){ editingProductId = null; boxDraft = []; imageDraft = null; render(); }
async function editProduct(id){
  await withPin(async ()=>{
    const p = productsCache.find(x=>x.id===id);
    editingProductId = id;
    boxDraft = p ? (p.pbs_boxes||[]).map(b=>({box_dimension:b.box_dimension||'', unit_in_box:b.unit_in_box==null?'':b.unit_in_box})) : [];
    imageDraft = p ? (p.image_url || null) : null;
    state.tab = 'products';
    await render();
    // Form usi row me khulta hai, isliye upar mat bhaago — bas us row ko
    // theek se saamne le aao.
    const row = document.querySelector('#products-list .edit-inline');
    if(row) row.scrollIntoView({block:'center', behavior:'smooth'});
  });
}
async function saveProduct(){
  await withPin(async ()=>{
    const name = document.getElementById('p_name').value.trim();
    if(!name){ toast('Product name likhna zaroori hai.', 'error'); return; }
    const uw = document.getElementById('p_uw').value;
    const payload = {
      name,
      unit_weight: uw === '' ? null : Number(uw),
      item_dimension:     document.getElementById('p_idim').value.trim()  || null,
      item_box_dimension: document.getElementById('p_ibdim').value.trim() || null,
      notes:              document.getElementById('p_notes').value.trim() || null,
      image_url:          imageDraft || null,
    };
    let productId = editingProductId;
    if(productId){
      const {error} = await sb.from('pbs_products').update(payload).eq('id', productId);
      if(error){ toast(friendlyDbError(error), 'error'); return; }
      const {error:delErr} = await sb.from('pbs_boxes').delete().eq('product_id', productId);
      if(delErr){ toast(friendlyDbError(delErr), 'error'); return; }
    } else {
      const {data, error} = await sb.from('pbs_products').insert(payload).select('id').single();
      if(error){ toast(friendlyDbError(error), 'error'); return; }
      productId = data.id;
    }
    // Blank rows are simply skipped — the sheet has plenty of products
    // whose box detail isn't filled in yet, and those stay blank here too.
    const rows = boxDraft
      .map((b,i)=>({
        product_id: productId,
        box_dimension: (b.box_dimension||'').trim() || null,
        unit_in_box: (b.unit_in_box === '' || b.unit_in_box == null) ? null : parseInt(b.unit_in_box, 10),
        sort_order: i,
      }))
      .filter(r => r.box_dimension !== null || r.unit_in_box !== null);
    if(rows.length){
      const {error} = await sb.from('pbs_boxes').insert(rows);
      if(error){ toast(friendlyDbError(error), 'error'); return; }
    }
    toast(editingProductId ? 'Product update ho gaya.' : 'Product add ho gaya.');
    editingProductId = null; boxDraft = []; imageDraft = null;
    await render();
  });
}
async function deleteProduct(id){
  await withPin(async ()=>{
    const p = productsCache.find(x=>x.id===id);
    if(!p) return;
    if(!confirm('"' + p.name + '" delete karna hai?\n\nDeleted Items tab se wapas restore kar sakte ho.')) return;
    const snapshot = {
      name:p.name, unit_weight:p.unit_weight, fba_unit:p.fba_unit,
      item_dimension:p.item_dimension, item_box_dimension:p.item_box_dimension,
      notes:p.notes, image_url:p.image_url,
      boxes: (p.pbs_boxes||[]).map(b=>({box_dimension:b.box_dimension, unit_in_box:b.unit_in_box, sort_order:b.sort_order})),
    };
    const {error:snapErr} = await sb.from('pbs_deleted_items').insert({
      table_name:'pbs_products', row_data:snapshot, summary:'Product — ' + p.name,
    });
    if(snapErr){ toast(friendlyDbError(snapErr), 'error'); return; }
    const {error} = await sb.from('pbs_products').delete().eq('id', id);
    if(error){ toast(friendlyDbError(error), 'error'); return; }
    toast('Delete ho gaya — Deleted Items se restore kar sakte ho.');
    await render();
  });
}

/* ---------------- VYAPAR STOCK tab ----------------
   Yahan app ka naam aur Vyapar ka naam aamne saamne rakhe jaate hain. Vyapar
   me naam thoda alag likha hota hai (AK-35 vs AK35, Wire Stripper vs Wire
   Stripping) aur kai jagah ek product ke kai item hote hain (CDSA), isliye
   jodna haath se hi theek rehta hai — app sirf aasan bana deta hai. */
let vyaparFilter = 'unlinked';
let vyaparSearch = '';
let pickerFor = null;      // kis product ka picker khula hai
let pickerTerm = '';

async function renderVyaparTab(box){
  const [{error: pErr}, {error: vErr}] = await Promise.all([loadProducts(), loadVyapar(true)]);
  const err = pErr || vErr;
  if(err){
    box.innerHTML = `<div class="msg error"><b>Vyapar data nahi khula:</b> ${esc(friendlyDbError(err))}</div>`;

  }

  const synced = lastSyncedAt();
  box.innerHTML = `
    <div class="card">
      <h3>🔗 Vyapar Stock</h3>
      <p class="config-note" style="margin-top:-4px">
        App ka product aur Vyapar ka item naam yahan jodo. Ek product ke saath kai Vyapar item
        jud sakte hain — jaise CDSA ke saath CDSA-HONDA, CDSA-TATA… — aur unka stock jud kar
        ek hi number banta hai. Search me isse kuch nahi badalta.
      </p>
      <div class="grid-stats grid-stats-2col" style="margin-top:12px">
        <div class="stat stat-good"><div class="num">${linked}</div><div class="lbl">jud gaye</div></div>
        <div class="stat ${productsCache.length-linked ? 'stat-bad' : 'stat-neutral'}">
          <div class="num">${productsCache.length - linked}</div><div class="lbl">baaki hain</div></div>
        <div class="stat stat-info"><div class="num">${vyaparCache.length}</div><div class="lbl">Vyapar item</div></div>
      </div>
      <p class="config-note" style="margin:12px 0 0">
        ${synced ? '📅 Vyapar se aakhri baar liya gaya: <b>' + esc(synced.toLocaleString('en-IN')) + '</b>. Ye abhi apne aap update nahi hota — AVEDIA PC se sync jodna baaki hai.'
                 : 'Abhi tak Vyapar se stock nahi aaya.'}
      </p>
    </div>
    <div class="card">
      <div class="segmented">
        <button class="${vyaparFilter==='unlinked'?'on':''}" onclick="setVyaparFilter('unlinked')">Baaki</button>
        <button class="${vyaparFilter==='linked'?'on':''}"   onclick="setVyaparFilter('linked')">Jude hue</button>
        <button class="${vyaparFilter==='all'?'on':''}"      onclick="setVyaparFilter('all')">Sab</button>
      </div>
      <div class="big-search">
        <span class="mag">🔍</span>
        <input id="vq" class="search-safe" placeholder="Product dhundo…" value="${esc(vyaparSearch)}" autocomplete="off">
      </div>
    </div>
    <div id="vyapar-list"></div>`;
  const input = document.getElementById('vq');
  input.addEventListener('input', ()=>{ vyaparSearch = input.value; paintVyaparList(); });
  paintVyaparList();
}
function setVyaparFilter(f){ vyaparFilter = f; pickerFor = null; renderTabContent(); }
function paintVyaparList(){
  const wrap = document.getElementById('vyapar-list');
  if(!wrap) return;
  const t = vyaparSearch.trim().toLowerCase();
  let list = productsCache.filter(p=>{
    // Jis product ka picker khula hai wo list me bana rehta hai, warna pehla
    // naam jodte hi row "Baaki" filter se gayab ho jaati thi aur doosra naam
    // (CDSA jaison ke liye zaroori) jodne ka mauka hi nahi milta tha.
    if(p.id === pickerFor) return true;
    const has = linksFor(p.id).length > 0;
    if(vyaparFilter === 'linked'   && !has) return false;
    if(vyaparFilter === 'unlinked' &&  has) return false;
    return !t || p.name.toLowerCase().includes(t);
  });
  if(!list.length){
    wrap.innerHTML = `<div class="card"><p class="empty">${
      vyaparFilter==='unlinked' ? 'Shabaash — koi product baaki nahi raha.' : 'Yahan kuch nahi mila.'}</p></div>`;
    return;
  }
  wrap.innerHTML = `<p class="result-count">${list.length} product</p>` + list.map(p=>{
    const rows = vyaparRowsFor(p.id);
    const total = stockFor(p.id);
    return `<div class="card">
      <div class="link-row" style="background:none; padding:0; margin:0">
        <span class="lr-name">${esc(p.name)}</span>
        ${rows.length ? `<span class="pill sold">${fmtQty(total)} stock</span>` : '<span class="pill unsold">joda nahi</span>'}
        <button class="primary" onclick="openPicker(${p.id})">+ Vyapar naam jodo</button>
      </div>
      ${rows.length ? `<div class="stock-parts">
        ${linksFor(p.id).map(l=>{
          const v = l.is_prefix ? null : vyaparIndex[String(l.pattern).toLowerCase()];
          return `<div class="stock-part">
            <span class="sp-name">${l.is_prefix ? esc(l.pattern) + '…' : esc(l.pattern)}${
              v ? '' : '<span class="mx-sub">Vyapar me ye naam ab nahi hai</span>'}</span>
            <span class="sp-qty">${v ? fmtQty(v.current_stock) : ''}</span>
            <button class="sp-x" onclick="removeLink(${l.id})">✕</button>
          </div>`;
        }).join('')}
      </div>` : ''}
      ${pickerFor === p.id ? pickerHtml(p) : ''}
    </div>`;
  }).join('');
  if(pickerFor){
    const pin = document.getElementById('pick-input');
    if(pin){
      pin.addEventListener('input', ()=>{ pickerTerm = pin.value; paintPickerHits(); });
      pin.focus();
    }
    paintPickerHits();
  }
}
function pickerHtml(p){
  return `<div class="link-pick">
    <div class="big-search">
      <span class="mag">🔍</span>
      <input id="pick-input" class="search-safe" placeholder="Vyapar ka naam dhundo…" value="${esc(pickerTerm)}" autocomplete="off">
    </div>
    <div id="pick-hits"></div>
  </div>`;
}
function openPicker(id){
  pickerFor = pickerFor === id ? null : id;
  pickerTerm = '';
  paintVyaparList();
}
function paintPickerHits(){
  const wrap = document.getElementById('pick-hits');
  if(!wrap || !pickerFor) return;
  const t = pickerTerm.trim().toLowerCase();
  if(!t){ wrap.innerHTML = '<p class="config-note" style="margin:8px 0 0">Vyapar ka naam type karo.</p>'; return; }
  const taken = {};
  linksCache.forEach(l => { if(l.product_id === pickerFor) taken[String(l.pattern).toLowerCase()] = 1; });
  const hits = vyaparCache.filter(v => v.item_name.toLowerCase().includes(t) && !taken[v.item_name.toLowerCase()]).slice(0, 25);
  wrap.innerHTML = hits.length
    ? hits.map(v=>`<div class="link-hit" onclick="addLink(${pickerFor}, ${JSON.stringify(v.item_name).replace(/"/g,'&quot;')})">
        <span>${markHit(v.item_name, pickerTerm.trim())}</span>
        <span class="lh-qty">${fmtQty(v.current_stock)}</span>
      </div>`).join('')
    : `<p class="empty" style="text-align:center">"${esc(pickerTerm)}" Vyapar me nahi mila.</p>`;
}
async function addLink(productId, pattern){
  const {data, error} = await sb.from('pbs_links')
    .insert({product_id: productId, pattern: pattern, is_prefix: false})
    .select('id, product_id, pattern, is_prefix').single();
  if(error){ toast(friendlyDbError(error), 'error'); return; }
  linksCache.push(data);
  pickerTerm = '';
  toast(pattern + ' jud gaya.');
  paintVyaparList();
}
async function removeLink(linkId){
  const {error} = await sb.from('pbs_links').delete().eq('id', linkId);
  if(error){ toast(friendlyDbError(error), 'error'); return; }
  linksCache = linksCache.filter(l => l.id !== linkId);
  toast('Hata diya.');
  paintVyaparList();
}

async function editBag(id){ await withPin(async ()=>{ editingBagId = id; await render(); window.scrollTo({top:0, behavior:'smooth'}); }); }
async function saveBag(){
  await withPin(async ()=>{
    const code = document.getElementById('b_code').value.trim();
    if(!code){ toast('Bag code likhna zaroori hai.', 'error'); return; }
    const payload = { code, product: document.getElementById('b_prod').value.trim() || null };

    if(editingBagId){
      ({error} = await sb.from('pbs_bags').update(payload).eq('id', editingBagId));
    } else {
      const {data} = await sb.from('pbs_bags').select('sort_order').order('sort_order',{ascending:false}).limit(1);
      payload.sort_order = data && data.length ? (data[0].sort_order||0)+1 : 0;
      ({error} = await sb.from('pbs_bags').insert(payload));
    }
    if(error){ toast(friendlyDbError(error), 'error'); return; }
    toast(editingBagId ? 'Bag update ho gaya.' : 'Bag add ho gaya.');
    editingBagId = null;
    await render();
  });

async function deleteBag(id){
  await withPin(async ()=>{
    const {data} = await sb.from('pbs_bags').select('*').eq('id', id).single();
    if(!data) return;
    if(!confirm('Bag "' + data.code + '" delete karna hai?')) return;
    const {error:snapErr} = await sb.from('pbs_deleted_items').insert({
      table_name:'pbs_bags',
      row_data:{code:data.code, product:data.product, sort_order:data.sort_order},
      summary:'Bag — ' + data.code + (data.product ? ' (' + data.product + ')' : ''),
    });
    if(snapErr){ toast(friendlyDbError(snapErr), 'error'); return; }
    const {error} = await sb.from('pbs_bags').delete().eq('id', id);
    if(error){ toast(friendlyDbError(error), 'error'); return; }
    toast('Bag delete ho gaya.');
    await render();
  });
}

}
async function restoreDeleted(id){
  await withPin(async ()=>{
    const {data:it, error:getErr} = await sb.from('pbs_deleted_items').select('*').eq('id', id).single();
    if(getErr || !it){ toast(friendlyDbError(getErr), 'error'); return; }
    const row = it.row_data || {};
    if(it.table_name === 'pbs_products'){
      const boxes = row.boxes || [];
      const prod = Object.assign({}, row);
      delete prod.boxes;
      const {data:ins, error} = await sb.from('pbs_products').insert(prod).select('id').single();
      if(error){ toast(friendlyDbError(error), 'error'); return; }
      if(boxes.length){
        const {error:bErr} = await sb.from('pbs_boxes').insert(boxes.map((b,i)=>({
          product_id: ins.id, box_dimension:b.box_dimension, unit_in_box:b.unit_in_box,
          sort_order: b.sort_order == null ? i : b.sort_order,
        })));
        if(bErr){ toast(friendlyDbError(bErr), 'error'); return; }
      }
    } else if(it.table_name === 'pbs_bags'){
      const {error} = await sb.from('pbs_bags').insert(row);
      if(error){ toast(friendlyDbError(error), 'error'); return; }
    }
    await sb.from('pbs_deleted_items').delete().eq('id', id);
    toast('Wapas restore ho gaya.');
    await render();
  });
}
async function forgetDeleted(id){
  await withPin(async ()=>{
    if(!confirm('Ye history entry hamesha ke liye hata dein? Phir restore nahi ho payega.')) return;
    const {error} = await sb.from('pbs_deleted_items').delete().eq('id', id);
    if(error){ toast(friendlyDbError(error), 'error'); return; }
    await render();
  });
}

function exportCSV(){
  const headers = ['Product Name','Box Weight','Box Dimension','Unit in Box','Unit Weight','FBA Unit','FBA Weight','Item Dimension','Item Box Dimension','Note','Image'];
  const rows = [];
  productsCache.forEach(p=>{
    const boxes = (p.pbs_boxes||[]).length ? p.pbs_boxes : [{box_dimension:null, unit_in_box:null}];
    boxes.forEach((b,i)=>{
      const bw = fmtWt(boxWeight(p,b));
      const fw = fmtWt(fbaWeight(p));
      rows.push([
        i===0 ? p.name : '',
        bw == null ? '' : bw,
        b.box_dimension == null ? '' : b.box_dimension,
        b.unit_in_box == null ? '' : b.unit_in_box,
        i===0 ? (p.unit_weight == null ? '' : p.unit_weight) : '',
        i===0 ? (p.fba_unit == null ? '' : p.fba_unit) : '',
        i===0 ? (fw == null ? '' : fw) : '',
        i===0 ? (p.item_dimension || '') : '',
        i===0 ? (p.item_box_dimension || '') : '',
        i===0 ? (p.notes || '') : '',
        i===0 ? (p.image_url || '') : '',
      ]);
    });
  });
  const csv = [headers].concat(rows)
    .map(r=>r.map(v=>'"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'product-box-size-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
const SETUP_SQL = [
"create table if not exists public.pbs_products (",
"  id bigint generated always as identity primary key,",
"  name text not null,",
"  unit_weight numeric,",
"  fba_unit integer,",
"  item_dimension text,",
"  item_box_dimension text,",
"  notes text,",
"  image_url text,",
"  created_at timestamptz not null default now()",
");",
"create unique index if not exists pbs_products_name_key on public.pbs_products (lower(name));",
"",
"create table if not exists public.pbs_boxes (",
"  id bigint generated always as identity primary key,",
"  product_id bigint not null references public.pbs_products(id) on delete cascade,",
"  box_dimension text,",
"  unit_in_box integer,",
"  sort_order integer not null default 0",
");",
"",
"create table if not exists public.pbs_bags (",
"  id bigint generated always as identity primary key,",
"  code text not null,",
"  product text,",
"  sort_order integer not null default 0",
");",
"",
"-- Vyapar ka stock (AVEDIA PC se sync hota hai) aur uska product se rishta",
"create table if not exists public.pbs_vyapar_items (",
"  item_name text primary key,",
"  current_stock integer,",
"  is_active boolean not null default true,",
"  synced_at timestamptz not null default now()",
");",
"",
"create table if not exists public.pbs_links (",
"  id bigint generated always as identity primary key,",
"  product_id bigint not null references public.pbs_products(id) on delete cascade,",
"  pattern text not null,",
"  is_prefix boolean not null default false,",
"  created_at timestamptz not null default now()",
");",
"create unique index if not exists pbs_links_uniq on public.pbs_links (product_id, lower(pattern), is_prefix);",
"create index if not exists pbs_links_product on public.pbs_links (product_id);",
"",
"create table if not exists public.pbs_deleted_items (",
"  id bigint generated always as identity primary key,",
"  table_name text not null,",
"  row_data jsonb not null,",
"  summary text,",
"  deleted_at timestamptz not null default now()",
");",
"",
"alter table public.pbs_products      enable row level security;",
"alter table public.pbs_boxes         enable row level security;",
"alter table public.pbs_bags          enable row level security;",
"alter table public.pbs_deleted_items enable row level security;",
"alter table public.pbs_vyapar_items  enable row level security;",
"alter table public.pbs_links         enable row level security;",
"",
"do $$",
"declare t text;",
"begin",
"  foreach t in array array['pbs_products','pbs_boxes','pbs_bags','pbs_deleted_items','pbs_vyapar_items','pbs_links'] loop",
"    execute format('drop policy if exists %I on public.%I', t||'_read', t);",
"    execute format('drop policy if exists %I on public.%I', t||'_write', t);",
"    execute format('create policy %I on public.%I for select to anon, authenticated using (true)', t||'_read', t);",
"    execute format('create policy %I on public.%I for all to anon, authenticated using (true) with check (true)', t||'_write', t);",
"  end loop;",
"end $$;",
"",
"insert into storage.buckets (id, name, public) values ('pbs-images','pbs-images', true)",
"on conflict (id) do update set public = true;",
"",
"drop policy if exists pbs_images_read  on storage.objects;",
"drop policy if exists pbs_images_write on storage.objects;",
"create policy pbs_images_read  on storage.objects for select to anon, authenticated using (bucket_id = 'pbs-images');",
"create policy pbs_images_write on storage.objects for all to anon, authenticated using (bucket_id = 'pbs-images') with check (bucket_id = 'pbs-images');",
].join('\n');
function copySetupSql(){
  navigator.clipboard.writeText(SETUP_SQL)
    .then(()=>toast('SQL copy ho gaya — Supabase SQL Editor me paste karo.'))
    .catch(()=>{ console.log(SETUP_SQL); toast('Copy nahi hua — console me print kar diya.', 'error'); });
}
